<title>Punkte-Logger · Das große Jesus-Quiz</title>
<style>
:root{--navy:#0b1446;--panel:#1c2c80;--panel2:#24379c;--gold:#ffb400;--gold2:#ffd45c;--ink:#141a3a;--muted:#b8c2ec;--green:#22b573;--red:#e74c3c;--line:#4a5aa8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 20%,#24368f 0%,#101a55 50%,#070c30 100%) fixed;
  -webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.ico{display:inline-flex;width:1em;height:1em}.ico svg{width:100%;height:100%}
.tb{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;border:2px solid #fff;flex:none;color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));background:rgba(7,12,48,.85);border-bottom:1px solid rgba(255,255,255,.1)}
.top h1{font-size:19px;margin:0;white-space:nowrap}.top h1 b{color:var(--gold)}
.top .sp{flex:1}
.tbtn{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;min-height:44px}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:14px;padding:12px max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));height:calc(100dvh - 62px)}
aside{display:flex;flex-direction:column;gap:8px;overflow:auto}
.sc{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;background:var(--panel);border-radius:14px;padding:6px 8px;border:2px solid transparent}
.sc.turn{border-color:var(--gold)}
.sc .tb{width:40px;height:40px;font-size:22px}
.sc .nm{font-weight:800;font-size:17px}.sc .pl{font-size:12px;color:var(--muted)}
.sc .pts{font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:50px;text-align:right}
.sc .pts.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.3);color:var(--gold2)}}
.corr{display:flex;flex-direction:column;gap:3px}
.corr button{background:rgba(255,255,255,.1);border-radius:7px;min-width:40px;min-height:26px;font-weight:700;font-size:12px}
.sc .kr{font-size:11px;color:var(--gold2)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:auto}
section{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{font-size:15px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 10px;font-weight:700;min-height:48px;display:flex;align-items:center;gap:8px}
.tab.on{background:var(--gold);color:var(--ink)}
.tab small{background:rgba(0,0,0,.25);border-radius:99px;padding:2px 8px;font-size:12px}
.tab.on small{background:rgba(0,0,0,.15)}
.pane{flex:1;overflow:auto;padding-bottom:20px}
.ph{display:flex;align-items:center;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:22px}.ph .sub{color:var(--muted);font-size:14px}
.chip{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;border-radius:99px;padding:3px 10px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.card.next{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,180,0,.25)}
.card.done{background:rgba(28,44,128,.45);border-color:rgba(255,255,255,.08)}
.card .hd{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.card .q{font-weight:700;font-size:16px}
.card .a{color:var(--gold2);font-size:14px;margin:3px 0 8px}
.card.done .q,.card.done .a{opacity:.6}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tc{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;background:rgba(255,255,255,.08);border:2px solid transparent;font-weight:700;font-size:14px;min-height:44px}
.tc .tb{width:30px;height:30px;font-size:16px}
.tc.on{background:var(--c);border-color:#fff}
.tc:disabled{opacity:.35}
.b{border-radius:10px;padding:10px 14px;font-weight:800;min-height:44px;background:var(--panel2);border:2px solid var(--line)}
.b.g{background:var(--green);border-color:var(--green)}.b.r{background:var(--red);border-color:var(--red)}.b.y{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.b.s{padding:6px 10px;min-height:36px;font-size:13px;font-weight:700}
.res{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ok{color:#7ff0b4}.muted{color:var(--muted)}
.edit{margin-left:auto;background:none;color:var(--muted);text-decoration:underline;font-size:13px;min-height:36px}
/* Brett */
.turnbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(7,12,48,.5);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.turnbar b{font-size:17px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat{background:var(--gold);color:var(--navy);border-radius:10px;text-align:center;font-weight:800;padding:10px 4px}
.fld{background:var(--panel);border:2px solid #8e9bd6;border-radius:12px;height:min(110px,15vh);font-size:38px;font-weight:800;color:var(--gold2);position:relative}
.fld.used{background:rgba(255,255,255,.04);border-style:dashed;border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.25);font-size:22px}
.fld.used .won{position:absolute;inset:auto 0 8px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px;color:#fff}
.fld.used .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;color:rgba(231,76,60,.55)}
/* Duell */
.duels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.duel h3{margin:0 0 8px;font-size:15px}
.ans{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#101a55;border:2px solid #8e9bd6;border-radius:10px;padding:8px;margin-bottom:6px;min-height:50px;font-weight:700;font-size:14px}
.ans .n{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ans.used{background:#1e3fa8;border-color:#1e3fa8}
.ans .tb{width:26px;height:26px;font-size:14px;margin-left:auto}
/* Finale */
.fin{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:44px 120px 90px auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 10px}
.fr .tb{width:40px;height:40px;font-size:22px}
.seg{display:flex;gap:4px}
.seg button{background:var(--navy);border:2px solid var(--line);border-radius:9px;min-width:48px;min-height:44px;font-weight:800}
.seg button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.seg button.okb.on{background:var(--green);border-color:var(--green);color:#fff}
.seg button.badb.on{background:var(--red);border-color:var(--red);color:#fff}
.seg button:disabled{opacity:.3}
/* Ranking */
.rk{display:grid;gap:8px;max-width:640px}
.rr{display:grid;grid-template-columns:50px 50px 1fr 80px;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 12px}
.rr .p{font-weight:800;font-size:26px;color:var(--gold2);text-align:center}.rr .tb{width:42px;height:42px;font-size:22px}
.rr .nm{font-weight:800;font-size:18px}.rr .pt{font-weight:800;font-size:24px;text-align:right}
.rr.p1{background:linear-gradient(90deg,#8a6400,var(--panel))}
/* Dialog */
.ov{position:fixed;inset:0;background:rgba(3,6,25,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.ov.open{display:flex}
.dlg{background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:18px 20px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 6px;font-size:20px}
.dlg .q{font-size:22px;font-weight:800;margin:8px 0}
.dlg .a{background:var(--green);border-radius:12px;padding:10px 14px;font-weight:700;font-size:18px;margin:8px 0 14px}
.risk{display:inline-block;background:var(--red);font-weight:800;border-radius:8px;padding:4px 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--green);font-weight:800;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.grid2,.duels{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap}.sc{flex:1 1 30%}.corr,.hint{display:none}}
@media (orientation:portrait) and (min-width:700px){.wrap{grid-template-columns:220px 1fr}}
</style>
</head>

g aus Ägypten"], "a": 2, "x": "Pessach erinnert an die Befreiung aus der Sklaverei in Ägypten."}, {"q": "Wie liest man Hebräisch?", "o": ["von links nach rechts", "von oben nach unten", "von rechts nach links"], "a": 2, "x": "Hebräisch liest und schreibt man von rechts nach links."}, {"q": "Was heißt „Schalom“?", "o": ["Frieden", "Danke", "Amen"], "a": 0, "x": "„Schalom“ heißt Frieden."}]}, {"id": "r2", "name": "Wer wird Bibel-Profi?", "show": "nach „Wer wird Millionär?“", "minutes": 15, "rules": ["Die Teams sind nacheinander dran. Jedes Team bekommt zwei Fragen.", "Stufe 1 bringt 20 Punkte, Stufe 2 bringt 40 Punkte.", "Das Team sagt: „Wir loggen ein: …“. Dann wird aufgelöst.", "Falsch? Das nächste Team darf klauen und bekommt die Hälfte der Punkte.", "Joker: 50:50 und Heft-Joker – jedes Team hat jeden Joker nur einmal im ganzen Spiel."], "callout": "Ist das euer letztes Wort?", "questions": [{"lvl": 1, "pts": 20, "q": "In welchem Fluss wurde Jesus getauft?", "o": ["im Nil", "im Jordan", "im Rhein", "im Euphrat"], "a": 1, "x": "Jesus ließ sich von Johannes im Jordan taufen (Mt 3,13–17)."}, {"lvl": 1, "pts": 20, "q": "Wer taufte Jesus?", "o": ["Petrus", "Mose", "Johannes", "Josef"], "a": 2, "x": "Johannes taufte viele Menschen im Jordan – auch Jesus."}, {"lvl": 1, "pts": 20, "q": "Was ist eine Synagoge?", "o": ["ein jüdisches Gebetshaus", "ein jüdisches Fest", "ein Sabbat-Brot", "ein Berg in Israel"], "a": 0, "x": "Die Synagoge ist das jüdische Gebetshaus. Jesus ging am Sabbat in die Synagoge."}, {"lvl": 1, "pts": 20, "q": "In welcher Stadt steht der Tempel?", "o": ["in Nazaret", "in Betlehem", "in Kafarnaum", "in Jerusalem"], "a": 3, "x": "Der Tempel stand in Jerusalem."}, {"lvl": 1, "pts": 20, "q": "Wie heißen die Eltern von Jesus?", "o": ["Maria und Josef", "Sara und Abraham", "Maria und Johannes", "Rut und Boas"], "a": 0, "x": "Jesus wohnte mit Maria und Josef in Nazaret."}, {"lvl": 1, "pts": 20, "q": "Was ist die Tora?", "o": ["ein Leuchter", "die Heilige Schrift der Juden", "ein Fest im Frühling", "ein Lesepult"], "a": 1, "x": "Die Tora ist die Heilige Schrift: die fünf Bücher Mose."}, {"lvl": 2, "pts": 40, "q": "Was ist eine Menora?", "o": ["ein Lesepult", "ein siebenarmiger Leuchter", "ein Sabbat-Brot", "eine Schriftrolle"], "a": 1, "x": "Die Menora ist ein siebenarmiger Leuchter. Sie erinnert an den Tempel."}, {"lvl": 2, "pts": 40, "q": "Wie alt war Jesus, als er im Tempel bei den Lehrern saß?", "o": ["8 Jahre", "10 Jahre", "12 Jahre", "30 Jahre"], "a": 2, "x": "Mit zwölf Jahren wanderte Jesus zum Pessachfest nach Jerusalem (Lk 2,41–52)."}, {"lvl": 2, "pts": 40, "q": "Wie kam Gottes Geist bei der Taufe auf Jesus herab?", "o": ["wie ein Adler", "wie eine Taube", "wie ein Feuer", "wie ein Stern"], "a": 1, "x": "Der Himmel öffnete sich und Gottes Geist kam wie eine Taube auf Jesus herab."}, {"lvl": 2, "pts": 40, "q": "Was bedeutet das Bitterkraut auf dem Sederteller?", "o": ["das Brot der Eile", "den Lehm für die Ziegel", "Das Leben als Sklaven war bitter.", "das Lamm"], "a": 2, "x": "Das Bitterkraut erinnert daran: Das Leben als Sklaven war bitter."}, {"lvl": 2, "pts": 40, "q": "Womit zeigt man beim Lesen in der Tora-Rolle auf die Buchstaben?", "o": ["mit dem Finger", "mit einem Zeigestab (Jad)", "mit einer Feder", "mit einer Kerze"], "a": 1, "x": "Man berührt die Buchstaben nicht mit dem Finger, sondern benutzt den Jad, einen Zeigestab."}, {"lvl": 2, "pts": 40, "q": "Was heißt „Abba“?", "o": ["Großvater", "lieber Vater", "Lehrer", "König"], "a": 1, "x": "„Abba“ heißt lieber Vater. So nennt Jesus Gott."}]}, {"id": "r3", "name": "Der große Preis", "show": "nach der Quizshow „Der große Preis“", "minutes": 15, "rules": ["Die Teams sind nacheinander dran und wählen ein Feld: Thema und Punkte.", "30 Sekunden beraten, dann antwortet ein Kind für das Team.", "Richtig: Das Team bekommt die Punkte. Falsch: Das nächste Team darf es versuchen.", "Achtung, Risikofeld: Hier gibt es doppelte Punkte!"], "callout": "Welches Feld nehmt ihr?", "categories": [{"name": "Sabbat", "fields": [{"pts": 10, "q": "Was steht auf dem Sabbat-Tisch? Nennt zwei Dinge.", "a": "zwei Kerzen, Challa-Brot, Becher mit Wein oder Traubensaft, weißes Festtischtuch"}, {"pts": 20, "q": "Was bedeuten die Kerzen am Sabbat?", "a": "Licht und Freude: Der Sabbat beginnt."}, {"pts": 30, "q": "Wer soll am Sabbat ruhen?", "a": "Alle – auch Knechte, Mägde und Tiere."}]}, {"name": "Synagoge", "fields": [{"pts": 10, "q": "Wie heißt der Schrank, in dem die Tora-Rollen aufbewahrt werden?", "a": "der Toraschrein"}, {"pts": 20, "q": "Was zeigt das Ewige Licht?", "a": "Es brennt immer – Gott ist immer da."}, {"pts": 30, "risk": true, "q": "Nennt zwei Dinge, die es nur in der Kirche gibt, aber nicht in der Synagoge.", "a": "Taufbecken, Kreuz, Altar"}]}, {"name": "Pessach", "fields": [{"pts": 10, "q": "Wie heißt das Brot ohne Hefe?", "a": "Mazza"}, {"pts": 20, "q": "Warum isst man zu Pessach Brot ohne Hefe?", "a": "Es ist das Brot der Eile – es gab keine Zeit, bis der Teig aufgeht."}, {"pts": 30, "q": "Was bedeutet das Fruchtmus (Charosset) auf dem Sederteller?", "a": "den Lehm, aus dem die Sklaven Ziegel machen mussten"}]}, {"name": "Jesu Leben", "fields": [{"pts": 10, "q": "In welchem Dorf wuchs Jesus auf?", "a": "in Nazaret"}, {"pts": 20, "risk": true, "q": "Was sagt Jesus zu den Pharisäern im Kornfeld?", "a": "„Der Sabbat ist für den Menschen da – nicht der Mensch für den Sabbat.“"}, {"pts": 30, "q": "Was sagt die Stimme aus dem Himmel bei der Taufe?", "a": "„Das ist mein geliebter Sohn, an dem ich Gefallen gefunden habe.“"}]}, {"name": "Gott & Gebet", "fields": [{"pts": 10, "q": "Welches Gebet lehrt Jesus seine Freunde?", "a": "das Vaterunser"}, {"pts": 20, "q": "Ergänzt: „Der HERR ist mein …, nichts wird mir fehlen.“", "a": "Hirt (Ps 23,1)"}, {"pts": 30, "q": "Warum benutzt die Bibel Bilder für Gott?", "a": "Niemand hat Gott je gesehen. Bilder helfen uns, etwas über Gott zu sagen."}]}]}, {"id": "r4", "name": "Das Klassen-Duell", "show" const [R1, R2, R3, R4, R5] = DATA.rounds;
const KEY = "pags_jesusquiz_logger_v1";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ico = (k) => `<span class="ico">${ICONS[k]}</span>`;
const N = DATA.teams.length;

// Foliennummern der PowerPoint (gleiche Reihenfolge wie im Generator)
const SL = { r1q: (i) => 6 + 2 * i, r2q: (i) => 24 + 2 * i, board: 50, r3q: (ci, fi) => 51 + 2 * (ci * 3 + fi), r4: (b) => 83 + 2 * b, code: 92 };

function fresh() {
  return { tab: "r1", names: DATA.teams.map((t) => t.name), corr: Array(N).fill(0),
    r1: {}, r2: {}, r3: {}, r3turn: 0, r4: {}, r4turn: 0, r5: { stakes: {}, res: {} } };
}
let L; try { L = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { L = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(L)); } catch (e) {} };
const color = (i) => "#" + DATA.teams[i].color;
const badge = (i) => `<span class="tb" style="background:${color(i)}">${ico("t" + i)}</span>`;
const nm = (i) => esc(L.names[i]);
const pts3 = (f) => (f.risk ? f.pts * 2 : f.pts);

// ---------- Punkte werden aus dem Zustand berechnet (Rückgängig = einfach Eintrag ändern) ----------
function roundPts() {
  const P = Array.from({ length: N }, () => [0, 0, 0, 0, 0]);
  R1.questions.forEach((q, i) => { const e = L.r1[i]; if (e) e.teams.forEach((t) => P[t][0] += R1.points); });
  R2.questions.forEach((q, i) => { const e = L.r2[i]; if (!e) return; const t = i % 6;
    if (e.res === "ok") P[t][1] += q.pts; else if (e.steal >= 0) P[e.steal][1] += q.pts / 2; });
  Object.entries(L.r3).forEach(([k, w]) => { if (w < 0) return; const [ci, fi] = k.split("-").map(Number); P[w][2] += pts3(R3.categories[ci].fields[fi]); });
  Object.values(L.r4).forEach((w) => { if (w >= 0) P[w][3] += R4.points; });
  for (let i = 0; i < N; i++) { const r = L.r5.res[i]; if (r === true) P[i][4] += L.r5.stakes[i] || 0; if (r === false) P[i][4] -= L.r5.stakes[i] || 0; }
  return P;
}
const totals = () => roundPts().map((r, i) => r.reduce((a, b) => a + b, 0) + L.corr[i]);
function ranking() { const T = totals(); return T.map((p, i) => ({ i, p })).sort((a, b) => b.p - a.p || a.i - b.i); }

let lastT = null;
function renderScore() {
  const T = totals(), rk = ranking(), place = {};
  let pl = 0, prev = null; rk.forEach((x, k) => { if (x.p !== prev) pl = k + 1; prev = x.p; place[x.i] = pl; });
  const turn = L.tab === "r2" ? nextR2Team() : L.tab === "r3" ? L.r3turn : L.tab === "r4" ? L.r4turn : -1;
  $("#score").innerHTML = T.map((p, i) => `<div class="sc${i === turn ? " turn" : ""}">${badge(i)}<div><div class="nm">${nm(i)}</div><div class="pl">Platz ${place[i]}${L.corr[i] ? ` · <span class="kr">Korr. ${L.corr[i] > 0 ? "+" : ""}${L.corr[i]}</span>` : ""}</div></div>
    <div class="pts${lastT && lastT[i] !== p ? " bump" : ""}">${p}</div>
    <div class="corr"><button data-c="${i}" data-d="5" aria-label="5 Punkte dazu">+5</button><button data-c="${i}" data-d="-5" aria-label="5 Punkte abziehen">−5</button></div></div>`).join("")
    + `<div class="hint">Punktestand wird auf diesem Gerät gespeichert.</div>`;
  lastT = T;
  document.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { L.corr[+b.dataset.c] += +b.dataset.d; save(); render(); });
}

// ---------- Tabs ----------
function counts() {
  return {
    r1: Object.keys(L.r1).length + "/8", r2: Object.keys(L.r2).length + "/12", r3: Object.keys(L.r3).length + "/15",
    r4: Object.keys(L.r4).length + "/18", r5: Object.keys(L.r5.res).length + "/6", rk: "",
  };
}
const TABS = [["r1", "1 · Eins, zwei, drei"], ["r2", "2 · Profi"], ["r3", "3 · Großer Preis"], ["r4", "4 · Duell"], ["r5", "Finale"], ["rk", "Ranking"]];
function renderTabs() {
  const c = counts();
  $("#tabs").innerHTML = TABS.map(([k, t]) => `<button class="tab${L.tab === k ? " on" : ""}" data-t="${k}">${t}${c[k] ? `<small>${c[k]}</small>` : ""}</button>`).join("");
  document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { L.tab = b.dataset.t; save(); render(); });
}

// ---------- Runde 1 ----------
const V = {};
let r1Draft = {};
V.r1 = () => {
  const next = R1.questions.findIndex((q, i) => !L.r1[i]);
  return `<div class="ph"><h2>Runde 1 · Eins, zwei oder drei</h2><span class="sub">Teams mit richtiger Karte antippen (+10), dann „Fertig“ – danach ist die Frage gesperrt.</span></div>
  <div class="grid2">${R1.questions.map((q, i) => { const e = L.r1[i], d = r1Draft[i] || [];
    return `<div class="card${e ? " done" : i === next ? " next" : ""}"><div class="hd"><span class="chip">${i + 1}</span>Folie ${SL.r1q(i)}/${SL.r1q(i) + 1}${e ? '<span class="ok">✓ erledigt</span>' : ""}</div>
    <div class="q">${esc(q.q)}</div><div class="a">Lösung: ${q.a + 1} – ${esc(q.o[q.a])}</div>
    ${e ? `<div class="res">${e.teams.length ? e.teams.map((t) => `${badge(t)}`).join("") + ` <span>je +10</span>` : '<span class="muted">kein Team richtig</span>'}<button class="edit" data-e1="${i}">ändern</button></div>`
      : `<div class="row">${L.names.map((n, t) => `<button class="tc${d.includes(t) ? " on" : ""}" style="--c:${color(t)}" data-q="${i}" data-t="${t}">${badge(t)}${esc(n)}</button>`).join("")}</div>
         <div class="row" style="margin-top:8px"><button class="b g" data-f1="${i}">Fertig ✓ ${d.length ? "(" + d.length + " × 10)" : ""}</button></div>`}</div>`; }).join("")}</div>`;
};
V.r1.bind = () => {
  document.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => {
    const i = +b.dataset.q, t = +b.dataset.t, d = r1Draft[i] = r1Draft[i] || [];
    d.includes(t) ? d.splice(d.indexOf(t), 1) : d.push(t); render();
  });
  document.querySelectorAll("[data-f1]").forEach((b) => b.onclick = () => { const i = +b.dataset.f1; L.r1[i] = { teams: (r1Draft[i] || []).slice() }; delete r1Draft[i]; save(); toast("Frage " + (i + 1) + " gespeichert"); render(); });
  document.querySelectorAll("[data-e1]").forEach((b) => b.onclick = () => { const i = +b.dataset.e1; r1Draft[i] = L.r1[i].teams.slice(); delete L.r1[i]; save(); render(); });
};

// ---------- Runde 2 ----------
function nextR2Team() { const i = R2.questions.findIndex((q, k) => !L.r2[k]); return i < 0 ? -1 : i % 6; }
let r2Wrong = {};
V.r2 = () => {
  const next = R2.questions.findIndex((q, i) => !L.r2[i]);
  return `<div class="ph"><h2>Runde 2 · Wer wird Bibel-Profi?</h2><span class="sub">Richtig oder falsch antippen – bei falsch darf ein anderes Team klauen (halbe Punkte).</span></div>
  <div class="grid2">${R2.questions.map((q, i) => { const e = L.r2[i], t = i % 6, L4 = "ABCD";
    let body;
    if (e) body = `<div class="res">${e.res === "ok" ? `${badge(t)} ${nm(t)} <span class="ok">+${q.pts}</span>` : e.steal >= 0 ? `<span class="muted">falsch</span> · Klau: ${badge(e.steal)} ${nm(e.steal)} <span class="ok">+${q.pts / 2}</span>` : '<span class="muted">falsch · keine Punkte</span>'}<button class="edit" data-e2="${i}">ändern</button></div>`;
    else if (r2Wrong[i]) body = `<div class="muted" style="font-size:13px;margin-bottom:6px">Klau-Chance (+${q.pts / 2}): Welches Team hatte die richtige Antwort?</div>
      <div class="row">${L.names.map((n, k) => k === t ? "" : `<button class="tc" style="--c:${color(k)}" data-st="${i}" data-t="${k}">${badge(k)}${esc(n)}</button>`).join("")}<button class="b s" data-st="${i}" data-t="-1">kein Team</button><button class="b s" data-un="${i}">zurück</button></div>`;
    else body = `<div class="row"><button class="b g" data-ok="${i}">✓ richtig +${q.pts}</button><button class="b r" data-bad="${i}">✗ falsch</button></div>`;
    return `<div class="card${e ? " done" : i === next ? " next" : ""}"><div class="hd"><span class="chip">${i + 1}</span>${badge(t)} <b style="color:#fff">${nm(t)}</b> · Stufe ${q.lvl} · Folie ${SL.r2q(i)}/${SL.r2q(i) + 1}</div>
      <div class="q">${esc(q.q)}</div><div class="a">Lösung: ${L4[q.a]} – ${esc(q.o[q.a])}</div>${body}</div>`; }).join("")}</div>`;
};
V.r2.bind = () => {
  document.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => { const i = +b.dataset.ok; L.r2[i] = { res: "ok", steal: -1 }; save(); toast("+" + R2.questions[i].pts + " für " + L.names[i % 6]); render(); });
  document.querySelectorAll("[data-bad]").forEach((b) => b.onclick = () => { r2Wrong[+b.dataset.bad] = true; render(); });
  document.querySelectorAll("[data-un]").forEach((b) => b.onclick = () => { delete r2Wrong[+b.dataset.un]; render(); });
  document.querySelectorAll("[data-st]").forEach((b) => b.onclick = () => { const i = +b.dataset.st, t = +b.dataset.t; L.r2[i] = { res: "bad", steal: t }; delete r2Wrong[i]; save(); render(); });
  document.querySelectorAll("[data-e2]").forEach((b) => b.onclick = () => { delete L.r2[+b.dataset.e2]; save(); render(); });
};

// ---------- Runde 3: Spielbrett ----------
function turnBar(key, label) {
  return `<div class="turnbar"><span class="muted">${label}</span>${L.names.map((n, i) => `<button class="tc${L[key] === i ? " on" : ""}" style="--c:${color(i)}" data-turn="${key}" data-t="${i}">${badge(i)}${esc(n)}</button>`).join("")}</div>`;
}
V.r3 = () => `<div class="ph"><h2>Runde 3 · Der große Preis</h2><span class="sub">Feld antippen, das das Team gewählt hat. Nach der Antwort ist das Feld gesperrt. Spielbrett = Folie ${SL.board}.</span></div>
  ${turnBar("r3turn", "Dran ist:")}
  <div class="board">${R3.categories.map((c) => `<div class="cat">${esc(c.name)}</div>`).join("")}
  ${[0, 1, 2].map((fi) => R3.categories.map((c, ci) => { const k = ci + "-" + fi, w = L.r3[k], f = c.fields[fi];
    if (w === undefined) return `<button class="fld" data-fld="${k}">${f.pts}</button>`;
    return `<button class="fld used" data-fld="${k}">${f.pts}${w >= 0 ? `<span class="won">${badge(w)} +${pts3(f)}</span>` : '<span class="x">✗</span>'}</button>`; }).join("")).join("")}</div>`;
V.r3.bind = () => {
  bindTurn();
  document.querySelectorAll("[data-fld]").forEach((b) => b.onclick = () => {
    const k = b.dataset.fld, [ci, fi] = k.split("-").map(Number), c = R3.categories[ci], f = c.fields[fi], w = L.r3[k];
    if (w !== undefined) {
      dialog(`<h3>${esc(c.name)} für ${f.pts} – schon gespielt</h3><p>${w >= 0 ? "Team " + nm(w) + " hat " + pts3(f) + " Punkte bekommen." : "Niemand hat die Punkte bekommen."}</p>
        <div class="row"><button class="b r" id="free">Feld wieder freigeben</button><button class="b" id="cx">Abbrechen</button></div>`);
      $("#free").onclick = () => { delete L.r3[k]; save(); closeDlg(); render(); };
      $("#cx").onclick = closeDlg; return;
    }
    const t = L.r3turn;
    dialog(`<h3>${esc(c.name)} für ${f.pts} <span class="muted" style="font-size:14px">· Folie ${SL.r3q(ci, fi)}/${SL.r3q(ci, fi) + 1}</span></h3>
      ${f.risk ? `<span class="risk">RISIKOFELD – ${pts3(f)} Punkte!</span>` : ""}
      <div class="q">${esc(f.q)}</div><div class="a">${esc(f.a)}</div>
      <div class="muted" style="margin-bottom:6px">Wer hat richtig geantwortet? (+${pts3(f)})</div>
      <div class="row"><button class="b g" data-w="${t}">✓ ${nm(t)} (dran)</button>${L.names.map((n, i) => i === t ? "" : `<button class="tc" style="--c:${color(i)}" data-w="${i}">${badge(i)}${esc(n)}</button>`).join("")}</div>
      <div class="row" style="margin-top:10px"><button class="b r" data-w="-1">✗ Niemand</button><span style="flex:1"></span><button class="b" id="cx">Abbrechen – Feld bleibt offen</button></div>`);
    document.querySelectorAll("[data-w]").forEach((x) => x.onclick = () => {
      const w2 = +x.dataset.w; L.r3[k] = w2; L.r3turn = (L.r3turn + 1) % N; save(); closeDlg();
      toast(w2 >= 0 ? "+" + pts3(f) + " für " + L.names[w2] : "Feld gesperrt – keine Punkte"); render();
    });
    $("#cx").onclick = closeDlg;
  });
};

// ---------- Runde 4 ----------
V.r4 = () => `<div class="ph"><h2>Runde 4 · Das Klassen-Duell</h2><span class="sub">Genannte Antwort antippen = +10 für das Team, das dran ist. Danach ist sie gesperrt.</span></div>
  ${turnBar("r4turn", "Dran ist:")}
  <div class="row" style="margin-bottom:10px"><button class="b r" id="miss">✗ Antwort nicht auf der Tafel / doppelt → nächstes Team</button></div>
  <div class="duels">${R4.boards.map((b, bi) => `<div class="card duel"><h3>Tafel ${bi + 1} · Folie ${SL.r4(bi)}<br><span class="muted" style="font-weight:600">${esc(b.q)}</span></h3>
    ${b.a.map((a, k) => { const key = bi + "-" + k, w = L.r4[key];
      return `<button class="ans${w !== undefined ? " used" : ""}" data-ans="${key}"><span class="n">${k + 1}</span>${esc(a)}${w !== undefined && w >= 0 ? badge(w) : w === -1 ? '<span class="muted" style="margin-left:auto">aufgedeckt</span>' : ""}</button>`; }).join("")}
    <button class="b s" data-all="${bi}">Rest aufdecken (ohne Punkte)</button></div>`).join("")}</div>`;
V.r4.bind = () => {
  bindTurn();
  $("#miss").onclick = () => { L.r4turn = (L.r4turn + 1) % N; save(); toast("Weiter: " + L.names[L.r4turn]); render(); };
  document.querySelectorAll("[data-ans]").forEach((b) => b.onclick = () => {
    const key = b.dataset.ans, w = L.r4[key];
    if (w !== undefined) {
      dialog(`<h3>Antwort schon aufgedeckt</h3><p>${w >= 0 ? "Gefunden von Team " + nm(w) + " (+10)." : "Ohne Punkte aufgedeckt."}</p>
        <div class="row"><button class="b r" id="free">Wieder freigeben</button><button class="b" id="cx">Abbrechen</button></div>`);
      $("#free").onclick = () => { delete L.r4[key]; save(); closeDlg(); render(); }; $("#cx").onclick = closeDlg; return;
    }
    L.r4[key] = L.r4turn; toast("+10 für " + L.names[L.r4turn]); L.r4turn = (L.r4turn + 1) % N; save(); render();
  });
  document.querySelectorAll("[data-all]").forEach((b) => b.onclick = () => { const bi = +b.dataset.all; for (let k = 0; k < 6; k++) if (L.r4[bi + "-" + k] === undefined) L.r4[bi + "-" + k] = -1; save(); render(); });
};
function bindTurn() { document.querySelectorAll("[data-turn]").forEach((b) => b.onclick = () => { L[b.dataset.turn] = +b.dataset.t; save(); render(); }); }

// ---------- Finale ----------
V.r5 = () => {
  const P = roundPts(), before = P.map((r, i) => r.slice(0, 4).reduce((a, b) => a + b, 0) + L.corr[i]);
  return `<div class="ph"><h2>Finale · Code knacken</h2><span class="sub">Einsatz eintragen (Folie 91), nach der Auflösung (Folie ${SL.code + 1}) richtig/falsch antippen. Lösung: <b style="color:var(--gold2)">${esc(R5.code.msg)}</b></span></div>
  <div class="fin">${L.names.map((n, i) => `<div class="fr">${badge(i)}<b>${esc(n)}</b><span class="muted">${before[i]} Pkt.</span>
    <div class="seg">${R5.stakes.map((v) => `<button data-sk="${i}" data-v="${v}" class="${L.r5.stakes[i] === v ? "on" : ""}" ${v > Math.max(0, before[i]) ? "disabled" : ""}>${v}</button>`).join("")}</div><span></span>
    <div class="seg"><button class="okb${L.r5.res[i] === true ? " on" : ""}" data-rs="${i}" data-r="1" ${L.r5.stakes[i] === undefined ? "disabled" : ""}>✓ richtig</button><button class="badb${L.r5.res[i] === false ? " on" : ""}" data-rs="${i}" data-r="0" ${L.r5.stakes[i] === undefined ? "disabled" : ""}>✗ falsch</button></div></div>`).join("")}</div>
  <p class="muted" style="font-size:14px">Bei Gleichstand: Schätzfrage (Folien 94–95) – Sieger mit „+5“ in der Punkteleiste markieren.</p>`;
};
V.r5.bind = () => {
  document.querySelectorAll("[data-sk]").forEach((b) => b.onclick = () => { const i = +b.dataset.sk; L.r5.stakes[i] = +b.dataset.v; save(); render(); });
  document.querySelectorAll("[data-rs]").forEach((b) => b.onclick = () => { const i = +b.dataset.rs, r = b.dataset.r === "1";
    L.r5.res[i] === r ? delete L.r5.res[i] : (L.r5.res[i] = r); save(); render(); });
};

// ---------- Ranking ----------
V.rk = () => {
  const r = ranking(), P = roundPts(); let pl = 0, prev = null;
  return `<div class="ph"><h2>Ranking</h2><span class="sub">Zum Eintragen auf Folie 96–98 oder einfach vorlesen – von Platz 6 nach oben.</span></div>
  <div class="rk">${r.map((x, k) => { if (x.p !== prev) pl = k + 1; prev = x.p;
    return `<div class="rr${pl === 1 ? " p1" : ""}"><span class="p">${pl}.</span>${badge(x.i)}<div><div class="nm">${nm(x.i)}</div><div class="muted" style="font-size:12px">R1 ${P[x.i][0]} · R2 ${P[x.i][1]} · R3 ${P[x.i][2]} · R4 ${P[x.i][3]} · Finale ${P[x.i][4]}${L.corr[x.i] ? " · Korr. " + L.corr[x.i] : ""}</div></div><span class="pt">${x.p}</span></div>`; }).join("")}</div>`;
};

// ---------- Dialog, Toast ----------
function dialog(h) { $("#dlg").innerHTML = h; $("#ov").classList.add("open"); }
function closeDlg() { $("#ov").classList.remove("open"); }
$("#ov").onclick = (e) => { if (e.target.id === "ov") closeDlg(); };
let TT; function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(TT); TT = setTimeout(() => el.classList.remove("show"), 1400); }

$("#reset").onclick = () => { if (confirm("Neues Spiel? Alle Punkte und gesperrten Felder werden gelöscht.")) { const n = L.names; L = fresh(); L.names = n; r1Draft = {}; r2Wrong = {}; save(); render(); } };
$("#names").onclick = () => {
  dialog(`<h3>Teamnamen</h3>${L.names.map((n, i) => `<div class="row" style="margin:6px 0">${badge(i)}<input data-n="${i}" value="${esc(n)}" maxlength="16" style="flex:1;font:700 17px inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--navy);color:#fff"></div>`).join("")}
    <div class="row" style="margin-top:10px"><button class="b y" id="ok">Fertig</button></div>`);
  $("#ok").onclick = () => { document.querySelectorAll("[data-n]").forEach((inp) => L.names[+inp.dataset.n] = inp.value.trim() || DATA.teams[+inp.dataset.n].name); save(); closeDlg(); render(); };
};

function render() { renderTabs(); $("#pane").innerHTML = V[L.tab](); V[L.tab].bind && V[L.tab].bind(); renderScore(); save(); }
render();
// Bildschirm anlassen (iPadOS 16.4+)
let WL = null; async function awake() { try { if ("wakeLock" in navigator && !WL && document.visibilityState === "visible") { WL = await navigator.wakeLock.request("screen"); WL.addEventListener("release", () => WL = null); } } catch (e) {} }
document.addEventListener("click", awake); document.addEventListener("visibilitychange", awake);
</script>
</body>
</html>
