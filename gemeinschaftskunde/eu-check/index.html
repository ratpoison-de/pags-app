<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU-Check – Fit für die Klassenarbeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0b2a6f; --blue2:#16409e; --gold:#ffcc00; --ink:#14182b; --muted:#5d6480;
  --bg:#f4f5fa; --card:#fff; --line:#e1e4ef; --ok:#1d8f5a; --okbg:#e3f6ec; --bad:#c23a3a; --badbg:#fbe7e7;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;line-height:1.15;margin:0}
.top{background:var(--blue);color:#fff;padding:18px 18px 22px;position:relative;overflow:hidden}
.top .stars{position:absolute;right:-40px;top:-40px;width:160px;height:160px;opacity:.45}
.top h1{font-size:28px;font-weight:800}
.top p{margin:4px 0 0;opacity:.85;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.back{background:none;border:0;color:#fff;opacity:.9;padding:0;margin-bottom:8px;font-size:14px;display:none}
.back.show{display:inline-block}
.prog{margin-top:14px;background:rgba(255,255,255,.18);border-radius:99px;height:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.progtxt{font-size:12px;margin-top:6px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(11,42,111,.08)}
.tile .ic{font-size:26px;line-height:1}
.tile b{display:block;font-family:"Bricolage Grotesque";font-size:17px}
.tile span{color:var(--muted);font-size:13px}
.tile .done{font-size:12px;color:var(--ok);font-weight:600;margin-top:4px}
.tile.big{grid-column:1/-1;background:var(--blue2);color:#fff;border:0}
.tile.big span{color:#dfe6ff}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 2px 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.q{font-size:18px;font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.opt:hover{border-color:var(--blue2)}
.opt.sel{border-color:var(--blue2);background:#eef2ff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--okbg);color:#0f5a37}
.fb.bad{background:var(--badbg);color:#7c1f1f}
.meta{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:#eef2ff;color:var(--blue2);font-weight:600}
/* flashcards */
.flip{perspective:1200px;cursor:pointer;user-select:none}
.flip .in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;font-size:20px;font-weight:600}
.front{background:var(--blue);color:#fff}
.backf{background:#fff;border:2px solid var(--blue);transform:rotateY(180deg);font-weight:500;font-size:17px}
.face small{position:absolute;top:12px;left:16px;font-size:12px;opacity:.7;font-weight:500}
/* inputs */
input.t,textarea.t,select.t{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
input.t:focus,textarea.t:focus,select.t:focus{outline:none;border-color:var(--blue2)}
input.t.ok,select.t.ok{border-color:var(--ok);background:var(--okbg)}
input.t.bad,select.t.bad{border-color:var(--bad);background:var(--badbg)}
textarea.t{width:100%;min-height:90px;resize:vertical}
.gap{display:inline-block;min-width:140px;margin:2px 2px}
.cloze{line-height:2.4;font-size:17px}
/* matching */
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
@media(min-width:620px){.mrow{grid-template-columns:1.3fr 1fr;align-items:center}}
/* sort */
.sortitem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.sortitem:last-child{border-bottom:0}
.sortitem .txt{flex:1}
.vn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
.vn.sel{border-color:var(--blue2);background:#eef2ff}
.vn.ok{border-color:var(--ok);background:var(--okbg)}
.vn.bad{border-color:var(--bad);background:var(--badbg)}
/* order */
.ord{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ord .n{font-weight:700;color:var(--blue2);width:22px}
.ord .txt{flex:1}
.ord button{background:#eef2ff;border:0;border-radius:8px;width:34px;height:34px;font-size:16px}
.ord.ok{border-color:var(--ok);background:var(--okbg)}
.ord.bad{border-color:var(--bad);background:var(--badbg)}
/* countries */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:12px}
.cg{border:2px dashed var(--line);border-radius:10px;padding:7px 9px;font-size:14px;color:var(--muted);min-height:38px}
.cg.found{border-style:solid;border-color:var(--ok);background:var(--okbg);color:#0f5a37;font-weight:600}
.cg.miss{border-style:solid;border-color:var(--bad);background:var(--badbg);color:#7c1f1f}
.score{font-family:"Bricolage Grotesque";font-size:44px;font-weight:800;color:var(--blue)}
.note{font-size:14px;background:#fff8d6;border:1px solid #f1df8a;border-radius:12px;padding:10px 12px}
.self{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.self button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.self button.on{border-color:var(--blue2);background:#eef2ff}
.ml{background:#f4f7ff;border-left:4px solid var(--blue2);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:15px}
.hidden{display:none!important}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 40px}
</style>
</head>

</header>

  setHead('EU-Check','Alles für die Klassenarbeit „Europäische Union“ – Klasse 10',false);updateProg();

function viewCards(){
  let deck=shuffle(CARDS.map((c,i)=>i)),pos=0,known=new Set(store.get('known',[]));
  const render=()=>{
    if(pos>=deck.length){const pct=known.size/CARDS.length*100;markDone('karten',pct);
      app.innerHTML=`<div class="card" style="text-align:center"><div class="score">${known.size}/${CARDS.length}</div><p>Karten als „gewusst“ markiert.</p><div class="row" style="justify-content:center"><button class="btn" id="again">Nur ungewusste wiederholen</button><button class="btn alt" id="all">Alle neu mischen</button></div></div>`;
      $('#again').onclick=()=>{deck=shuffle(CARDS.map((c,i)=>i).filter(i=>!known.has(i)));if(!deck.length){deck=shuffle(CARDS.map((c,i)=>i))}pos=0;render()};
      $('#all').onclick=()=>{deck=shuffle(CARDS.map((c,i)=>i));pos=0;render()};return}
    const i=deck[pos],c=CARDS[i];
    app.innerHTML=`<div class="meta" style="margin-bottom:8px">Karte ${pos+1} von ${deck.length} · tippen zum Umdrehen</div>
    <div class="flip" id="fl"><div class="in"><div class="face front"><small>Begriff</small>${esc(c[0])}</div><div class="face backf"><small>Erklärung</small>${esc(c[1])}</div></div></div>
    <div class="row" style="margin-top:14px"><button class="btn alt" id="no">✗ Noch nicht</button><span class="sp"></span><button class="btn" id="yes">✓ Gewusst</button></div>`;
    $('#fl').onclick=()=>$('#fl').classList.toggle('on');
    $('#yes').onclick=()=>{known.add(i);store.set('known',[...known]);pos++;render()};
    $('#no').onclick=()=>{known.delete(i);store.set('known',[...known]);pos++;render()};
  };render();
}

/* ---------- Quiz ---------- */
function mcBlock(item,idx,onAnswer){
  const ord=shuffle(item.o.map((t,i)=>i));
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<div class="q">${idx?idx+'. ':''}${esc(item.q)}</div><div class="opts">${ord.map(i=>`<button class="opt" data-i="${i}">${esc(item.o[i])}</button>`).join('')}</div><div class="fbx"></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(el.dataset.done)return;el.dataset.done=1;const i=+b.dataset.i,ok=i===item.a;
    b.classList.add(ok?'ok':'bad');el.querySelector(`[data-i="${item.a}"]`).classList.add('ok');
    el.querySelector('.fbx').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Richtig!':'Leider falsch. Richtig: <b>'+esc(item.o[item.a])+'</b>'}</div>`;
    onAnswer(ok);
  });return el;
}
function viewQuiz(){
  const qs=shuffle(MC).slice(0,10);let n=0,right=0;
  const next=()=>{
    if(n>=qs.length){const pct=right/qs.length*100;markDone('quiz',pct);
      app.innerHTML=`<div class="card" style="text-align:center"><div class="score">${right}/${qs.length}</div><p>${pct>=80?'Stark! 💪':pct>=50?'Ganz ordentlich – noch eine Runde?':'Schau nochmal in die Lernkarten.'}</p><button class="btn" id="re">Neue Runde</button></div>`;$('#re').onclick=viewQuiz;return}
    app.innerHTML=`<div class="meta" style="margin-bottom:8px">Frage ${n+1} von ${qs.length} · ${right} richtig</div>`;
    const b=mcBlock(qs[n],0,ok=>{if(ok)right++;const nb=document.createElement('div');nb.className='row';nb.style.marginTop='12px';nb.innerHTML='<span class="sp"></span><button class="btn">Weiter →</button>';nb.querySelector('button').onclick=()=>{n++;next()};b.appendChild(nb)});
    app.appendChild(b);
  };next();
}

/* ---------- Reihenfolge ---------- */
function viewOrder(id,title,items){
  let cur=shuffle(items.map((x,i)=>i));let checked=false;
  const render=()=>{
    app.innerHTML=`<div class="meta" style="margin-bottom:8px">${title} – mit den Pfeilen verschieben.</div><div id="ol">${cur.map((i,p)=>`<div class="ord" data-p="${p}"><span class="n">${p+1}</span><span class="txt">${checked&&items[i][0]?'<b>'+items[i][0]+':</b> ':''}${esc(items[i][1])}</span><button data-up="${p}" aria-label="nach oben">▲</button><button data-dn="${p}" aria-label="nach unten">▼</button></div>`).join('')}</div>
    <div class="row" style="margin-top:6px"><button class="btn" id="chk">Prüfen</button><button class="btn alt" id="re">Neu mischen</button><span class="sp"></span><span id="res" class="meta"></span></div>`;
    app.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const p=+b.dataset.up;if(p>0){[cur[p-1],cur[p]]=[cur[p],cur[p-1]];checked=false;render()}});
    app.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const p=+b.dataset.dn;if(p<cur.length-1){[cur[p+1],cur[p]]=[cur[p],cur[p+1]];checked=false;render()}});
    $('#re').onclick=()=>{cur=shuffle(items.map((x,i)=>i));checked=false;render()};
    $('#chk').onclick=()=>{checked=true;render();let r=0;app.querySelectorAll('.ord').forEach((el,p)=>{const ok=cur[p]===p;el.classList.add(ok?'ok':'bad');if(ok)r++});
      $('#res').innerHTML=r===items.length?'<b>Alles richtig! 🎉</b>':`<b>${r}/${items.length}</b> an der richtigen Stelle`;markDone(id,r/items.length*100)};
  };render();
}

/* ---------- Lückentexte ---------- */
function clozeHTML(c,ci){let k=0;return c.s.replace(/\[([^\]]+)\]/g,(m,w)=>`<input class="t gap" data-c="${ci}" data-k="${k++}" data-w="${esc(w)}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(90,w.length*11)}px">`)}
function checkGap(inp,c){const w=inp.dataset.w,v=norm(inp.value),al=[w,...((c.alt||{})[w]||[])].map(norm);const ok=al.includes(v)||(w==='Europäischen Kommission'&&v.includes('kommission'))||(w==='Europäische Gerichtshof'&&v.includes('gerichtshof'));inp.classList.remove('ok','bad');inp.classList.add(ok?'ok':'bad');return ok}
function viewCloze(){
  app.innerHTML=CLOZES.map((c,ci)=>`<div class="card"><h3 style="margin-bottom:8px">${c.t}</h3><div class="cloze">${clozeHTML(c,ci)}</div><div class="row" style="margin-top:10px"><button class="btn" data-chk="${ci}">Prüfen</button><button class="btn alt" data-sol="${ci}">Lösung zeigen</button><span class="sp"></span><span class="meta" id="r${ci}"></span></div></div>`).join('');
  const scores={};
  app.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.chk;const ins=[...app.querySelectorAll(`input[data-c="${ci}"]`)];const r=ins.filter(i=>checkGap(i,CLOZES[ci])).length;$('#r'+ci).innerHTML=`<b>${r}/${ins.length}</b> richtig`;scores[ci]=r/ins.length;
    const vals=CLOZES.map((c,i)=>scores[i]||0);markDone('luecke',vals.reduce((a,b)=>a+b,0)/CLOZES.length*100)});
  app.querySelectorAll('[data-sol]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.sol;app.querySelectorAll(`input[data-c="${ci}"]`).forEach(i=>{if(!i.classList.contains('ok')){i.value=i.dataset.w;i.classList.remove('bad')}})});
}

    app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
    const add=()=>{const raw=$('#cin').value;let v=norm(raw);if(!v)return;const syn=SYN[v];const idx=list.findIndex(c=>norm(c)===v||c===syn);

      else if(idx>=0){$('#cmsg').textContent='Hast du schon.'}
      else{$('#cmsg').textContent=(mode==='euro'&&MEMBERS.some(c=>norm(c)===v))?'EU-Land, aber kein Euro!':'Nicht in der Liste.'}
      $('#cin').value='';$('#ccount').textContent=`${found.size}/${list.length}`;markDone('laender',found.size/list.length*100*(mode==='eu'?1:1))};
    $('#cadd').onclick=add;$('#cin').onkeydown=e=>{if(e.key==='Enter')add()};

function viewOpen(){
  const self=store.get('self',{});
  app.innerHTML=`<div class="note" style="margin-bottom:12px">Schreib deine Antwort (oder sag sie laut), dann vergleiche mit der Musterlösung und bewerte dich selbst. In der Arbeit zählt: Behauptung + Begründung + Beispiel.</div>`+
  OPEN.map((o,i)=>`<div class="card"><div class="q">${i+1}. ${esc(o.q)}</div><textarea class="t" data-i="${i}" placeholder="Deine Antwort…">${esc(store.get('ans'+i,''))}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn alt" data-show="${i}">Musterlösung zeigen</button></div><div class="ml hidden" id="ml${i}">${esc(o.m)}</div>
  <div class="self hidden" id="sf${i}">${[['2','Konnte ich 💪'],['1','Teilweise'],['0','Nochmal üben']].map(x=>`<button data-sf="${i}" data-v="${x[0]}" class="${self[i]===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div>`).join('');
  app.querySelectorAll('textarea').forEach(t=>t.oninput=()=>store.set('ans'+t.dataset.i,t.value));
  app.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const i=b.dataset.show;$('#ml'+i).classList.remove('hidden');$('#sf'+i).classList.remove('hidden')});
  app.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{const i=b.dataset.sf;self[i]=b.dataset.v;store.set('self',self);app.querySelectorAll(`[data-sf="${i}"]`).forEach(x=>x.classList.toggle('on',x===b));
    const pts=Object.values(self).reduce((a,v)=>a+ +v,0);markDone('offen',pts/(OPEN.length*2)*100)});
}

/* ---------- Probe-Klassenarbeit ---------- */
function note(p){return p>=92?'1':p>=81?'2':p>=67?'3':p>=50?'4':p>=30?'5':'6'}
function viewExam(){
  const mc=shuffle(MC).slice(0,10);
  const mt=shuffle(MATCH).slice(0,4);
  const vn=shuffle(VN).slice(0,4);
  const cz=CLOZES[Math.floor(Math.random()*CLOZES.length)];
  const op=shuffle(OPEN).slice(0,2);
  let h=`<div class="note" style="margin-bottom:12px">Wie in der echten Arbeit: erst alles bearbeiten, dann unten auf <b>Abgeben</b>. Keine Hilfen! Zeit-Tipp: 30 Minuten.</div>`;
  h+=`<h2 style="margin:8px 0 10px">Teil A – Wissen (10 P.)</h2><div id="mcA"></div>`;
  h+=`<h2 style="margin:18px 0 10px">Teil B – Organe (4 P.)</h2><div class="card">${mt.map((m,i)=>`<div class="mrow"><div>${esc(m[0])}</div><select class="t" data-mt="${i}"><option value="">– wählen –</option>${ORGANE.map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select></div>`).join('')}</div>`;
  h+=`<h2 style="margin:18px 0 10px">Teil C – Vorteil oder Nachteil? (4 P.)</h2><div class="card">${vn.map((x,i)=>`<div class="sortitem"><span class="txt">${esc(x[0])}</span><button class="vn" data-ei="${i}" data-v="V">Vorteil</button><button class="vn" data-ei="${i}" data-v="N">Nachteil</button></div>`).join('')}</div>`;
  h+=`<h2 style="margin:18px 0 10px">Teil D – Lückentext: ${cz.t}</h2><div class="card"><div class="cloze">${clozeHTML(cz,9)}</div></div>`;
  h+=`<h2 style="margin:18px 0 10px">Teil E – Erklären & Begründen (je 2 P.)</h2>${op.map((o,i)=>`<div class="card"><div class="q">${esc(o.q)}</div><textarea class="t" data-op="${i}" placeholder="Deine Antwort…"></textarea><div class="ml hidden" data-ml="${i}"><b>Musterlösung:</b> ${esc(o.m)}</div><div class="self hidden" data-ss="${i}"><span class="meta" style="align-self:center">Deine Punkte:</span>${[2,1,0].map(v=>`<button data-sp="${i}" data-v="${v}">${v} P.</button>`).join('')}</div></div>`).join('')}`;
  h+=`<div class="row" style="margin:14px 0"><button class="btn gold" id="sub">Abgeben</button><span class="sp"></span></div><div id="result"></div>`;
  app.innerHTML=h;
  const mcAns=[];const mcBox=$('#mcA');
  mc.forEach((it,i)=>{const ord=shuffle(it.o.map((t,j)=>j));const el=document.createElement('div');el.className='card';
    el.innerHTML=`<div class="q">${i+1}. ${esc(it.q)}</div><div class="opts">${ord.map(j=>`<button class="opt" data-j="${j}">${esc(it.o[j])}</button>`).join('')}</div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(mcBox.dataset.locked)return;mcAns[i]=+b.dataset.j;el.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))});
    mcBox.appendChild(el)});
  const vnSel={};
  app.querySelectorAll('[data-ei]').forEach(b=>b.onclick=()=>{if(mcBox.dataset.locked)return;const i=b.dataset.ei;vnSel[i]=b.dataset.v;app.querySelectorAll(`[data-ei="${i}"]`).forEach(x=>x.className='vn'+(x.dataset.v===vnSel[i]?' sel':''))});
  const opPts={};
  $('#sub').onclick=()=>{
    if(mcBox.dataset.locked)return;mcBox.dataset.locked=1;$('#sub').disabled=true;
    let pA=0;mcBox.querySelectorAll('.card').forEach((el,i)=>{const it=mc[i];el.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.j;b.classList.remove('sel');if(j===it.a)b.classList.add('ok');else if(j===mcAns[i])b.classList.add('bad')});if(mcAns[i]===it.a)pA++});
    let pB=0;app.querySelectorAll('[data-mt]').forEach(s=>{const ok=s.value!==''&&+s.value===mt[+s.dataset.mt][1];s.classList.add(ok?'ok':'bad');if(ok)pB++;s.disabled=true});
    let pC=0;vn.forEach((x,i)=>{app.querySelectorAll(`[data-ei="${i}"]`).forEach(b=>{b.className='vn';if(b.dataset.v===x[1])b.classList.add('ok');else if(vnSel[i]===b.dataset.v)b.classList.add('bad')});if(vnSel[i]===x[1])pC++});
    const gaps=[...app.querySelectorAll('input[data-c="9"]')];let pD=0;gaps.forEach(g=>{if(checkGap(g,cz))pD++;else g.value+=g.value?'  → '+g.dataset.w:g.dataset.w;g.disabled=true});
    app.querySelectorAll('[data-ml]').forEach(e=>e.classList.remove('hidden'));app.querySelectorAll('[data-ss]').forEach(e=>e.classList.remove('hidden'));
    const maxAuto=mc.length+mt.length+vn.length+gaps.length,max=maxAuto+op.length*2;
    const show=()=>{const pE=Object.values(opPts).reduce((a,b)=>a+b,0);const tot=pA+pB+pC+pD+pE,pct=tot/max*100;const missing=op.length-Object.keys(opPts).length;
      $('#result').innerHTML=`<div class="card" style="text-align:center"><div class="meta">Ergebnis</div><div class="score">${tot} / ${max} P.</div><p style="margin:4px 0 10px">${Math.round(pct)} % · voraussichtlich Note <b style="font-size:22px">${note(pct)}</b>${missing?`<br><span class="meta">Bewerte noch ${missing} offene Aufgabe${missing>1?'n':''} in Teil E selbst.</span>`:''}</p>
      <div class="meta">A ${pA}/${mc.length} · B ${pB}/${mt.length} · C ${pC}/${vn.length} · D ${pD}/${gaps.length} · E ${pE}/${op.length*2}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="newex">Neue Probearbeit</button></div></div>`;
      $('#newex').onclick=viewExam;markDone('probe',pct)};
    app.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const i=b.dataset.sp;opPts[i]=+b.dataset.v;app.querySelectorAll(`[data-sp="${i}"]`).forEach(x=>x.classList.toggle('on',x===b));show()});
    show();$('#result').scrollIntoView({behavior:'smooth'});
  };
}

route();
</script>
</body>
</html>
