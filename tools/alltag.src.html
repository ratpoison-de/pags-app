<title data-keep>PAGS Alltag</title>
<meta data-keep name="claude:viewport-fit-sides" content="cover">
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
<style data-keep>
/* Layout: PAGS-Website-Look als Taschen-App – weißer Kopf mit Logo, rote Akzente, graue Versal-Überschriften, Tab-Leiste unten, dunkler Footer */
:root{
  --red:#A81010; --red-dark:#860000; --red-meta:#801A1A; --red-soft:#F7EDED;
  --bg:#F7F7F7; --surface:#FFFFFF; --alt:#FCFCFC; --line:#E1E1E1; --text:#444444; --head:#666666; --muted:#777777;
  --board:#333333; --board-ink:#FFFFFF; --foot:#222222; --foot-text:#DDDDDD;
  --ok:#3C9A5F; --warn:#C98A12;
  --f:"Open Sans",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:12}
.top .wrap{padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin:0;font-weight:400;font-size:15px;color:var(--head);text-transform:uppercase;letter-spacing:1px}
.brand-logo{display:block;width:104px;height:52px;background:url("{{LOGO}}") left center/contain no-repeat}
.brand .sep{width:1px;height:34px;background:var(--line)}
.today{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
main .wrap{padding-block:14px 150px;display:grid;gap:14px}
h2{font-weight:400;font-size:24px;color:var(--head);text-transform:uppercase;letter-spacing:1px;margin:8px 0 0}
h3{font-size:14px;font-weight:400;letter-spacing:1px;text-transform:uppercase;color:var(--head);margin:0}
p{margin:0}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.board{background:var(--board);color:var(--board-ink);border:0;border-top:4px solid var(--red)}
.board h3{color:#ccc}
.status{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;line-height:1.25}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:#E57373}
.dot.on{background:#6FCF97}.dot.off{background:#E57373}
.rows{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.board .row{border-top:1px solid #4a4a4a;padding-top:6px}
.chalk{background:var(--red);color:#fff;padding:0 7px;border-radius:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick a{display:grid;gap:2px;text-align:center;text-decoration:none;color:#fff;background:var(--red);border:1px solid var(--red-dark);border-radius:3px;padding:10px 8px;min-width:0}
.quick a b{font-size:15px;font-weight:600}
.quick a span{font-size:12px;opacity:.85}
.quick a:hover{background:var(--red-dark)}
@media (max-width:380px){.quick{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:3px;background:var(--red-soft);color:var(--red-meta);white-space:nowrap}
.pill.ferien{background:#FBEAEA;color:var(--red)}
.pill.frei{background:#FFF4DE;color:#7A5300}
.list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .when{font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;font-weight:600;color:#333}
.list .what{min-width:0;display:grid;gap:2px}
.list .what b{font-weight:600;color:#333}
.list .what span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.list li.past{opacity:.55}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:3px 8px;font-size:13px;cursor:pointer}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.contact{display:grid;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
.contact:first-of-type{border-top:0}
.contact .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.contact .who b{font-size:16px;font-weight:600;color:#333}
.contact .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px}
.contact .line .mono{font-size:14px;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:1px 7px;font-size:12px;cursor:pointer}
.copy:hover{border-color:var(--red);color:var(--red)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{font-size:14px;padding:2px 9px;border-radius:3px;background:var(--alt);border:1px solid var(--line)}
input[type=search],input[type=text],input[type=date],input[type=time],input[type=url],textarea{width:100%;border:1px solid var(--line);background:var(--alt);border-radius:3px;padding:9px 11px;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{border-color:var(--red);outline:none;background:#fff}
form.add{display:grid;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:13px;color:var(--muted);display:grid;gap:3px}
.btn{border:1px solid var(--red-dark);border-radius:3px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{background:var(--red-dark)}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--red);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px}
ul.plain li::marker{color:var(--red)}
.linkgroup{display:grid;gap:6px}
.linkgroup a{overflow-wrap:anywhere}
.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.notice{border-left:3px solid var(--red);padding:10px 12px;background:var(--red-soft);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:728px;margin:0 auto 8px;background:var(--board);color:#fff;border-top:3px solid var(--red);border-radius:3px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.savebar .in span{font-size:14px}
.savebar .btn.ghost{color:#fff;border-color:#666}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;border-top:2px solid transparent;padding:8px 2px 11px;font-size:12.5px;color:var(--head);cursor:pointer;display:grid;justify-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true]{color:var(--red);border-top-color:var(--red)}
footer.meta{font-size:13px;color:var(--muted);display:grid;gap:8px;padding-top:6px}
.sitefoot{background:var(--foot);color:var(--foot-text);font-size:13px;border-radius:3px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.sitefoot b{display:inline-block;color:#fff;font-weight:400;border-bottom:2px solid var(--red);margin-bottom:6px}
.sitefoot a{color:#fff}
</style>

      parts = { year: d.getFullYear(), month: String(d.getMonth() + 1).padStart(2, '0'), day: String(d.getDate()).padStart(2, '0'), hour: String(d.getHours()).padStart(2, '0'), minute: String(d.getMinutes()).padStart(2, '0'), weekday: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] };
    }
    var wd = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[parts.weekday];
    return { iso: parts.year + '-' + parts.month + '-' + parts.day, wd: wd, hm: parts.hour + ':' + parts.minute };
  }
  var WD = ['', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  var WDK = ['', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  var MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  function parseISO(s) { var a = s.split('-'); return new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])); }
  function wdOf(s) { var d = parseISO(s).getUTCDay(); return d === 0 ? 7 : d; }
  function fmtShort(s) { var a = s.split('-'); return WDK[wdOf(s)] + ' ' + a[2] + '.' + a[1] + '.'; }
  function fmtLong(s) { var a = s.split('-'); return WD[wdOf(s)] + ', ' + (+a[2]) + '. ' + MON[+a[1] - 1] + ' ' + a[0]; }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  function fmtRange(v, b) { return v === b ? fmtShort(v) : fmtShort(v) + '–' + fmtShort(b); }

  function ferienHeute(iso) { return S.ferien.filter(function (f) { return f.von <= iso && iso <= f.bis; })[0]; }
  function naechsteFerien(iso) { return S.ferien.filter(function (f) { return f.von > iso; }).sort(function (a, b) { return a.von < b.von ? -1 : 1; })[0]; }

  function sekStatus(n) {
    var z = S.sekretariat.zeiten;
    var frei = ferienHeute(n.iso);
    var heute = (!frei && z[n.wd]) || [];
    for (var i = 0; i < heute.length; i++) {
      if (n.hm >= heute[i][0] && n.hm < heute[i][1]) return { open: true, text: 'Sekretariat geöffnet', sub: 'bis ' + heute[i][1] + ' Uhr' };
    }
    // nächste Öffnung suchen
    for (var k = 0; k < 14; k++) {
      var d = new Date(parseISO(n.iso).getTime() + k * 86400000);
      var iso = d.toISOString().slice(0, 10), wd = wdOf(iso);
      if (ferienHeute(iso)) continue;
      var sl = z[wd] || [];
      for (var j = 0; j < sl.length; j++) {
        if (k > 0 || sl[j][0] > n.hm) {
          var tag = k === 0 ? 'heute' : k === 1 ? 'morgen' : fmtShort(iso);
          return { open: false, text: 'Sekretariat geschlossen', sub: 'wieder ' + tag + ' ab ' + sl[j][0] + ' Uhr' };
        }
      }
    }
    return { open: false, text: 'Sekretariat geschlossen', sub: '' };
  }

      '<div class="grid2">' +

        '</section>' +

  function markSaved(text) {
    ORIGINAL = JSON.parse(JSON.stringify(S));
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    busy = false; msg = text; render();
  }

  function downloadLocal(name) {
    var url = URL.createObjectURL(new Blob([buildDoc(false)], { type: 'text/html' }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function saveArtifact() {
    busy = true; msg = ''; render();
    art.publish(buildDoc(true)).then(function () {
      busy = false; msg = 'Gespeichert.';
    }, function (err) {
      busy = false;
      var c = err && err.code;
      if (c === 'conflict') { msg = 'Jemand anderes hat gerade gespeichert. Die Seite lädt neu.'; }
      else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].indexOf(c) >= 0) {
        art = null; readOnly = true; msg = 'Diese Ansicht darf die Seite nicht ändern.' + (dl ? ' Sie können eine Kopie als Datei sichern.' : '');
      }
      else if (c === 'rate_limited') { msg = 'Zu viele Speichervorgänge. Bitte in einer Minute erneut speichern.'; }
      else if (c === 'too_large') { msg = 'Die Seite ist zu groß zum Speichern. Bitte alte Einträge löschen.'; }
      else { msg = 'Speichern hat nicht geklappt. Bitte gleich noch einmal versuchen.'; }
      render();
    });
  }

  // Lokal: Chrome/Edge schreiben direkt in die Datei (beim ersten Mal diese Datei auswählen), andere Browser laden eine neue Datei herunter
  function saveLocal() {
    if (window.showSaveFilePicker) {
      busy = true; msg = ''; render();
      var get = fileHandle ? Promise.resolve(fileHandle) : window.showSaveFilePicker({
        suggestedName: decodeURIComponent(location.pathname.split('/').pop() || '') || 'pags-alltag.html',
        types: [{ description: 'HTML-Seite', accept: { 'text/html': ['.html', '.htm'] } }]
      });
      get.then(function (h) {
        fileHandle = h;
        return h.createWritable().then(function (w) { return w.write(buildDoc(false)).then(function () { return w.close(); }); }).then(function () { markSaved('Gespeichert in „' + h.name + '“.'); });
      }).catch(function (err) {
        busy = false;
        if (err && err.name === 'AbortError') msg = 'Speichern abgebrochen. Die Änderungen bleiben als Entwurf in diesem Browser.';
        else { fileHandle = null; msg = 'Direktes Speichern ging nicht. Nutzen Sie „Kopie herunterladen“ und ersetzen Sie damit die alte Datei.'; }
        render();
      });
    } else {
      downloadLocal('pags-alltag.html');
      markSaved('Neue Datei „pags-alltag.html“ heruntergeladen. Ersetzen Sie damit die alte Datei.');
    }
  }

  function save() {
    if (busy) return;
    if (art) saveArtifact();
    else if (!FRAMED) saveLocal();
  }

  function download() {
    var n = now(), name = 'pags-alltag-' + n.iso + '.html';
    if (dl) {
      dl.save({ filename: name, data: new Blob([buildDoc(false)], { type: 'text/html' }) }).then(function () { msg = 'Kopie gesichert.'; render(); },
        function (err) { if (!(err && (err.code === 'cancelled' || err.code === 'declined'))) { msg = 'Die Datei konnte nicht gesichert werden.'; render(); } });
    } else if (!FRAMED) {
      downloadLocal(name); msg = 'Kopie mit Stand ' + fmtShort(n.iso) + ' heruntergeladen.'; render();
    }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    var d = t.dataset;
    if (d.tab) { tab = d.tab; msg = ''; try { history.replaceState(null, '', '#' + tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
    if (d.go) { tab = d.go; render(); window.scrollTo(0, 0); return; }
    if (d.copy) {
      var ok = function () { var o = t.textContent; t.textContent = 'kopiert'; setTimeout(function () { t.textContent = o; }, 1400); };
      try { navigator.clipboard.writeText(d.copy).then(ok, function () { sel(t); }); } catch (x) { sel(t); }
      return;
    }
    if (d.delTermin) { S.termine = S.termine.filter(function (x) { return x.id !== d.delTermin; }); render(); return; }
    if (d.delNote) { S.notizen = S.notizen.filter(function (x) { return x.id !== d.delNote; }); render(); return; }
    if (d.delLink) { S.links = S.links.filter(function (x) { return x.id !== d.delLink; }); render(); return; }
    if (d.discard) { S = JSON.parse(JSON.stringify(ORIGINAL)); msg = ''; try { localStorage.removeItem(LS_KEY); } catch (x) {} render(); return; }
    if (d.save) { save(); return; }
    if (d.download) { download(); return; }
    if (d.restore) {
      if (d.restore === '1' && restore) { S = restore; }
      restore = null;
      try { localStorage.removeItem(LS_KEY); } catch (x) {}
      render(); return;
    }
  });
  function sel(b) {
    var el = b.previousElementSibling; if (!el) return;
    var r = document.createRange(); r.selectNodeContents(el);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  document.addEventListener('submit', function (e) {
    var f = e.target; if (!f.dataset.form) return;
    e.preventDefault();
    var v = {}; Array.prototype.forEach.call(f.elements, function (el) { if (el.name) v[el.name] = el.value.trim(); });
    if (f.dataset.form === 'termin') {
      if (!v.datum || !v.titel) return;
      S.termine.push({ id: uid(), datum: v.datum, zeit: v.zeit || '', titel: v.titel, notiz: v.notiz || '' });
    } else if (f.dataset.form === 'notiz') {
      if (!v.text) return;
      S.notizen.push({ id: uid(), datum: now().iso, text: v.text });
    } else if (f.dataset.form === 'link') {
      if (!v.titel || !/^https?:\/\//i.test(v.url)) { msg = 'Bitte eine Adresse angeben, die mit https:// beginnt.'; render(); return; }
      S.links.push({ id: uid(), gruppe: 'Eigene Links', titel: v.titel, url: v.url });
    }
    msg = ''; render();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'k-suche') { query = e.target.value; render(); }
  });

  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });

  render();
  setInterval(function () { if (!document.activeElement || document.activeElement === document.body) render(); }, 60000);

  (function initCaps(tries) {
    if (window.claude && window.claude.use) {
      window.claude.use('artifact').then(function (a) { art = a; if (!a && FRAMED) readOnly = true; render(); }, function () { if (FRAMED) readOnly = true; render(); });
      window.claude.use('downloads').then(function (x) { dl = x; render(); }, function () {});
    } else if (FRAMED && tries < 20) {
      setTimeout(function () { initCaps(tries + 1); }, 250);
    } else if (FRAMED) { readOnly = true; render(); }
  })(0);
})();
</script>
