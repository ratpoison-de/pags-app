<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="author" content="Thorsten von Plotho-Kettner">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das große Jesus-Quiz – Quizshow Religion Klasse 4</title>
<link rel="icon" href="../../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1446;--panel:#1c2c80;--panel2:#24379c;--gold:#ffb400;--gold2:#ffd45c;--ink:#141a3a;
  --white:#fff;--muted:#b8c2ec;--green:#22b573;--red:#e74c3c;--dim:#3a4580;--line:#4a5aa8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:18px/1.4 Inter,Arial,sans-serif;color:var(--white);
  background:radial-gradient(ellipse at 50% 30%,#2a3c9a 0%,#121c5c 45%,#070c30 100%) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 25%,rgba(255,255,255,.035) 0 6deg,transparent 6deg 18deg)}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.ico{display:inline-flex;width:1em;height:1em}
.ico svg{width:100%;height:100%}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:rgba(7,12,48,.82);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;white-space:nowrap;cursor:pointer}
.top .brand b{color:var(--gold)}
.top .rname{color:var(--gold2);font-weight:600;font-size:15px;white-space:nowrap}
.mini{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.mini .t{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:rgba(255,255,255,.08);font-weight:700;font-size:15px;transition:transform .3s}
.mini .t.bump{transform:scale(1.18)}
.mini .t.turn{outline:3px solid var(--gold)}
.tb{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:#fff;border:2px solid #fff;flex:none}
.tools{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);font-size:18px}
.iconbtn:hover{background:rgba(255,255,255,.2)}

main{max-width:1240px;margin:0 auto;padding:22px 18px 60px;position:relative}
.center{text-align:center}
.chip{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;border-radius:99px;padding:6px 16px;font-size:15px;letter-spacing:.04em}
.sub{color:var(--muted);font-style:italic}
.card{background:rgba(28,44,128,.92);border:2px solid var(--gold);border-radius:18px;padding:22px 26px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btn{background:var(--gold);color:var(--ink);font-weight:800;border-radius:14px;padding:14px 26px;font-size:20px;box-shadow:0 4px 0 #b37e00;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b37e00}
.btn.alt{background:var(--panel2);color:#fff;box-shadow:0 4px 0 #101a55;border:2px solid var(--line)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #13774a}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #962a1f}
.btn.small{font-size:16px;padding:10px 16px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.spacer{flex:1}

/* Start */
.hero h1{font-size:clamp(40px,7vw,84px);font-weight:800;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.hero .welcome{color:var(--gold2);font-size:22px;margin-bottom:8px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:26px 0}
.team{background:var(--panel);border:2px solid var(--c);border-radius:16px;padding:14px;text-align:center}
.team .tb{width:74px;height:74px;font-size:40px;margin:0 auto 8px;border-width:3px}
.team input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;color:#fff;font:700 18px Inter;padding:6px;text-align:center}

/* Zeitplan */
.tl{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:22px 0}
.tl div{text-align:center}
.tl .m{width:74px;height:74px;border-radius:50%;margin:0 auto 6px;background:var(--panel2);border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.tl .m small{font-size:11px;font-weight:600;color:var(--muted)}
.tl b{display:block;color:var(--gold2);font-size:15px}
.tl span{font-size:14px}
.jokers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.jk{display:flex;gap:14px;align-items:center}
.jk .bubble{width:70px;height:70px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:none}
ul.rules{margin:0;padding-left:22px;font-size:20px}
ul.rules li{margin:6px 0}

/* Rundenintro */
.divider{text-align:center;padding-top:30px}
.divider h1{font-size:clamp(40px,6vw,72px);margin:14px 0 6px}
.divider .card{max-width:820px;margin:26px auto;text-align:left;display:flex;gap:20px;align-items:center}
.divider .time{text-align:center;color:var(--gold2);font-weight:800;font-size:20px;flex:none}
.divider .time .ico{font-size:58px;color:var(--gold)}

/* Frage */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.qhead h2{font-size:30px}
.qbox{background:var(--panel);border:3px solid var(--gold);border-radius:20px;padding:26px;text-align:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:clamp(26px,3.6vw,44px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:24px 0}
.fp{border-radius:18px;padding:18px;text-align:center;border:3px solid #fff;min-height:220px;display:flex;flex-direction:column;justify-content:center;transition:all .4s;position:relative}
.fp .n{font-size:90px;font-weight:800;line-height:1;font-family:"Bricolage Grotesque"}
.fp .o{font-size:26px;font-weight:700;margin-top:8px}
.fp.off{background:var(--dim)!important;color:#8c93b8;border-color:#5a64a0;transform:scale(.95)}
.fp.win{box-shadow:0 0 0 8px var(--gold),0 0 40px var(--gold);transform:scale(1.04)}
.fp .ok{position:absolute;top:-16px;left:50%;transform:translateX(-50%)}
.expl{background:var(--green);border-radius:14px;padding:14px 20px;font-weight:700;font-size:21px;margin:16px 0;animation:pop .4s}
.expl.blue{background:var(--panel);border:2px solid var(--green)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.whoright{margin-top:10px}
.whoright p{margin:0 0 8px;color:var(--gold2);font-weight:700}
.tchip{display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:99px;background:rgba(255,255,255,.08);border:2px solid transparent;font-weight:700;font-size:18px}
.tchip.on{background:var(--c);border-color:#fff}
.tchip:disabled{opacity:.35}

/* Millionär */
.mill{display:grid;grid-template-columns:1fr 250px;gap:22px}
.hex{position:relative;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:#c9d1f2;padding:3px}
.hex>div{clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:var(--navy);padding:22px 50px;text-align:center}
.hex.q>div{font-family:"Bricolage Grotesque";font-weight:800;font-size:clamp(24px,3vw,36px);padding:34px 60px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.ans{display:block;width:100%;text-align:left;background:none;padding:0}
.ans .hex>div{text-align:left;font-size:22px;font-weight:600;padding:18px 40px}
.ans b{color:var(--gold);margin-right:10px}
.ans.sel .hex>div{background:#e08a00;color:#fff}
.ans.sel b{color:#fff}
.ans.ok .hex>div{background:var(--green);animation:blink .35s 3}
.ans.ok b,.ans.bad b{color:#fff}
.ans.bad .hex>div{background:var(--red)}
.ans.gone{visibility:hidden}
@keyframes blink{50%{filter:brightness(1.5)}}
.ladder{background:rgba(7,12,48,.6);border-radius:14px;padding:10px;align-self:start}
.ladder div{display:flex;gap:8px;padding:5px 10px;border-radius:8px;font-size:15px}
.ladder div span:first-child{color:var(--gold2);width:24px;font-weight:700}
.ladder div span:last-child{margin-left:auto;color:var(--gold2);font-weight:700}
.ladder .cur{background:var(--gold);color:var(--navy)}
.ladder .cur span{color:var(--navy)!important}
.ladder .done{opacity:.55}
.ladder hr{border:0;border-top:1px dashed var(--gold);margin:4px 0}
.jokerbar{display:flex;gap:10px}
.jbtn{width:78px;height:56px;border-radius:50%;background:var(--navy);border:2px solid var(--gold);font-weight:800;font-size:15px;color:#fff}
.jbtn:disabled{opacity:.25;text-decoration:line-through}
.turnbox{display:flex;align-items:center;gap:12px}
.turnbox .tb{width:58px;height:58px;font-size:32px}
.turnbox h2{font-size:30px}

/* Spielbrett */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.board .cat{background:var(--gold);color:var(--navy);border-radius:12px;padding:14px 6px;text-align:center;font-weight:800;font-size:20px}
.field{background:var(--panel);border:2px solid #8e9bd6;border-radius:14px;height:108px;font-family:"Bricolage Grotesque";font-weight:800;font-size:50px;color:var(--gold2);box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .15s}
.field:hover:not(:disabled){transform:scale(1.05);background:var(--panel2)}
.field:disabled{background:rgba(255,255,255,.04);color:transparent;border-style:dashed;box-shadow:none}
.risk{display:inline-block;background:var(--red);color:#fff;font-weight:800;padding:10px 22px;border-radius:12px;font-size:24px;animation:wob .6s 3}
@keyframes wob{25%{transform:rotate(-4deg) scale(1.08)}75%{transform:rotate(4deg) scale(1.08)}}
.answerbox{background:var(--green);border-radius:18px;padding:24px;text-align:center;font-size:clamp(24px,3vw,36px);font-weight:800;margin:20px 0;animation:pop .4s}

/* Duell */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.bar{display:flex;align-items:center;gap:14px;background:#101a55;border:2px solid #8e9bd6;border-radius:14px;padding:12px 14px;font-size:24px;font-weight:700;text-align:left;width:100%;min-height:76px;transition:background .3s}
.bar .num{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.bar .txt{flex:1;color:#6f7bb8}
.bar .pts{background:var(--navy);border:1px solid var(--gold);color:var(--gold2);border-radius:8px;padding:6px 10px;font-size:18px}
.bar.open{background:#1e3fa8;animation:flip .5s}
.bar.open .txt{color:#fff}
.bar .by{font-size:14px;color:var(--gold2);font-weight:600}
@keyframes flip{from{transform:rotateX(90deg)}to{transform:none}}

/* Finale */
.abc{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;margin:16px 0}
.abc div{background:var(--panel);border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;font-size:16px}
.abc b{color:var(--gold2)}
.code{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin:26px 0}
.code .w{display:flex;gap:8px}
.code .c{text-align:center}
.code .c i{font-style:normal;color:var(--gold2);font-weight:800;font-size:22px}
.code .c div{width:58px;height:70px;border:2px solid #fff;border-radius:10px;background:#101a55;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:4px}
.code.sol .c div{background:var(--green);animation:pop .4s backwards}
.stakes{display:grid;gap:10px}
.stk{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 14px}
.stk .nm{font-weight:800;font-size:20px;width:150px}
.stk .sc{color:var(--muted);width:110px}
.seg{display:flex;gap:6px}
.seg button{background:var(--navy);border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:800;font-size:18px;min-width:56px}
.seg button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.seg button:disabled{opacity:.3}
.seg button.okb.on{background:var(--green);border-color:var(--green);color:#fff}
.seg button.badb.on{background:var(--red);border-color:var(--red);color:#fff}

/* Timer */
.timer{display:inline-flex;align-items:center;gap:10px;background:rgba(7,12,48,.7);border:2px solid var(--gold);border-radius:99px;padding:6px 16px 6px 8px;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.timer .ico{font-size:30px;color:var(--gold)}
.timer.warn{border-color:var(--red);color:#ff8a80;animation:blink .5s infinite}

/* Punkte */
.score{display:grid;gap:10px;margin-top:20px}
.srow{display:grid;grid-template-columns:50px 64px 170px 1fr 80px auto;gap:12px;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px}
.srow .pl{font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;color:var(--gold2);text-align:center}
.srow .tb{width:52px;height:52px;font-size:28px}
.srow .nm{font-weight:800;font-size:22px}
.srow .track{height:26px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden}
.srow .track i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width 1s}
.srow .pts{font-weight:800;font-size:28px;text-align:right}
.adj button{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:800;font-size:18px}

/* Siegerehrung */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:30px 0 10px;min-height:420px}
.pod{width:220px;text-align:center}
.pod .blk{border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:80px;color:var(--navy);padding-top:10px;border:3px solid #fff;border-bottom:0}
.pod .tb{width:96px;height:96px;font-size:54px;margin:0 auto 8px;border-width:4px}
.pod .nm{font-weight:800;font-size:24px}
.pod .p{color:var(--gold2);font-weight:700;margin-bottom:8px}
.pod.hide{visibility:hidden}
.pod.show{animation:rise .8s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.crown{font-size:56px;color:var(--gold);animation:wob 1.2s infinite}
.reveal{max-width:700px;margin:0 auto}
.reveal .srow{grid-template-columns:50px 64px 1fr 90px;animation:pop .5s}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Menü */
.overlay{position:fixed;inset:0;background:rgba(3,6,25,.75);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.overlay .card{max-width:720px;width:100%;max-height:90vh;overflow:auto}
.menu button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border-radius:10px;padding:12px 16px;margin:6px 0;font-weight:600}
.menu button:hover{background:rgba(255,255,255,.16)}
.foot{text-align:center;color:#8e9bd6;font-size:13px;margin-top:40px}

/* Urkunden */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  body::before,.top,main,.overlay,canvas{display:none!important}
  #print{display:block}
  .cert{page-break-after:always;height:180mm;border:6px double #b37e00;border-radius:10px;padding:18mm;text-align:center;font-family:Arial;color:#0b1446}
  .cert h1{font-size:44px;margin:6mm 0}
  .cert .big{font-size:34px;font-weight:800;margin:8mm 0}
  .cert .tbp{width:30mm;height:30mm;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:20mm;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:820px){
  .mill{grid-template-columns:1fr}.ladder{display:none}
  .answers,.duel,.jokers{grid-template-columns:1fr}
  .floor{grid-template-columns:1fr}.fp{min-height:120px}
  .tl{grid-template-columns:repeat(4,1fr)}
  .srow{grid-template-columns:40px 52px 1fr 60px}.srow .track,.srow .adj{display:none}
  .mini{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand" title="Zur Startseite"><b>★</b> Das große Jesus-Quiz</div>
  <div class="rname" id="rname"></div>
  <div class="mini" id="mini"></div>
  <div class="tools">
    <button class="iconbtn" id="bScore" title="Punktestand">🏆</button>
    <button class="iconbtn" id="bSound" title="Ton an/aus">🔊</button>
    <button class="iconbtn" id="bFull" title="Vollbild">⛶</button>
    <button class="iconbtn" id="bMenu" title="Menü">☰</button>
  </div>
</header>
<main id="app"></main>
<div class="overlay" id="ov"><div class="card" id="ovc"></div></div>
<canvas id="confetti"></canvas>
<div id="print"></div>

<script>
const DATA = {"title": "Das große Jesus-Quiz", "subtitle": "Die Quizshow zur Klassenarbeit · Religion Klasse 4a/b", "topic": "Jesus – ein Jude, der zu Gott Abba sagt", "teams": [{"name": "Fische", "emoji": "🐟", "color": "2E86DE"}, {"name": "Tauben", "emoji": "🕊️", "color": "8E44AD"}, {"name": "Schafe", "emoji": "🐑", "color": "27AE60"}, {"name": "Löwen", "emoji": "🦁", "color": "E67E22"}, {"name": "Kamele", "emoji": "🐫", "color": "C0392B"}, {"name": "Esel", "emoji": "🫏", "color": "16A085"}], "jokers": [{"id": "fifty", "name": "50:50", "desc": "Zwei falsche Antworten verschwinden. Nur in Runde 2."}, {"id": "heft", "name": "Heft-Joker", "desc": "30 Sekunden im Übungsheft oder in den Arbeitsblättern nachschauen. In Runde 2 oder 3."}], "rounds": [{"id": "r1", "name": "Eins, zwei oder drei", "show": "nach der Kindershow „1, 2 oder 3“", "minutes": 10, "points": 10, "rules": ["Alle Teams spielen gleichzeitig.", "Jedes Team berät leise und hält dann die Karte 1, 2 oder 3 hoch.", "Jede richtige Antwort bringt 10 Punkte."], "callout": "Eins, zwei oder drei – letzte Chance … vorbei!", "questions": [{"q": "Wo wuchs Jesus auf?", "o": ["in Jerusalem", "in Nazaret", "in Rom"], "a": 1, "x": "Jesus wuchs mit Maria und Josef in Nazaret auf."}, {"q": "Welche Religion hatte Jesus?", "o": ["Er war Christ.", "Er war Jude.", "Er war Römer."], "a": 1, "x": "Jesus war Jude und blieb sein Leben lang Jude."}, {"q": "Wann beginnt der Sabbat?", "o": ["am Sonntagmorgen", "am Freitagabend", "am Montagabend"], "a": 1, "x": "Der Sabbat beginnt am Freitagabend – mit Kerzen und einem festlichen Tisch."}, {"q": "Welche Sprache sprach Jesus im Alltag?", "o": ["Aramäisch", "Latein", "Englisch"], "a": 0, "x": "Im Alltag sprach Jesus Aramäisch."}, {"q": "Was ist Challa?", "o": ["das geflochtene Sabbat-Brot", "ein Leuchter", "ein Gebet"], "a": 0, "x": "Challa ist das geflochtene Brot auf dem Sabbat-Tisch."}, {"q": "Woran erinnert das Pessachfest?", "o": ["an die Geburt Jesu", "an die Ernte", "an die Befreiung aus Ägypten"], "a": 2, "x": "Pessach erinnert an die Befreiung aus der Sklaverei in Ägypten."}, {"q": "Wie liest man Hebräisch?", "o": ["von links nach rechts", "von oben nach unten", "von rechts nach links"], "a": 2, "x": "Hebräisch liest und schreibt man von rechts nach links."}, {"q": "Was heißt „Schalom“?", "o": ["Frieden", "Danke", "Amen"], "a": 0, "x": "„Schalom“ heißt Frieden."}]}, {"id": "r2", "name": "Wer wird Bibel-Profi?", "show": "nach „Wer wird Millionär?“", "minutes": 15, "rules": ["Die Teams sind nacheinander dran. Jedes Team bekommt zwei Fragen.", "Stufe 1 bringt 20 Punkte, Stufe 2 bringt 40 Punkte.", "Das Team sagt: „Wir loggen ein: …“. Dann wird aufgelöst.", "Falsch? Das nächste Team darf klauen und bekommt die Hälfte der Punkte.", "Joker: 50:50 und Heft-Joker – jedes Team hat jeden Joker nur einmal im ganzen Spiel."], "callout": "Ist das euer letztes Wort?", "questions": [{"lvl": 1, "pts": 20, "q": "In welchem Fluss wurde Jesus getauft?", "o": ["im Nil", "im Jordan", "im Rhein", "im Euphrat"], "a": 1, "x": "Jesus ließ sich von Johannes im Jordan taufen (Mt 3,13–17)."}, {"lvl": 1, "pts": 20, "q": "Wer taufte Jesus?", "o": ["Petrus", "Mose", "Johannes", "Josef"], "a": 2, "x": "Johannes taufte viele Menschen im Jordan – auch Jesus."}, {"lvl": 1, "pts": 20, "q": "Was ist eine Synagoge?", "o": ["ein jüdisches Gebetshaus", "ein jüdisches Fest", "ein Sabbat-Brot", "ein Berg in Israel"], "a": 0, "x": "Die Synagoge ist das jüdische Gebetshaus. Jesus ging am Sabbat in die Synagoge."}, {"lvl": 1, "pts": 20, "q": "In welcher Stadt steht der Tempel?", "o": ["in Nazaret", "in Betlehem", "in Kafarnaum", "in Jerusalem"], "a": 3, "x": "Der Tempel stand in Jerusalem."}, {"lvl": 1, "pts": 20, "q": "Wie heißen die Eltern von Jesus?", "o": ["Maria und Josef", "Sara und Abraham", "Maria und Johannes", "Rut und Boas"], "a": 0, "x": "Jesus wohnte mit Maria und Josef in Nazaret."}, {"lvl": 1, "pts": 20, "q": "Was ist die Tora?", "o": ["ein Leuchter", "die Heilige Schrift der Juden", "ein Fest im Frühling", "ein Lesepult"], "a": 1, "x": "Die Tora ist die Heilige Schrift: die fünf Bücher Mose."}, {"lvl": 2, "pts": 40, "q": "Was ist eine Menora?", "o": ["ein Lesepult", "ein siebenarmiger Leuchter", "ein Sabbat-Brot", "eine Schriftrolle"], "a": 1, "x": "Die Menora ist ein siebenarmiger Leuchter. Sie erinnert an den Tempel."}, {"lvl": 2, "pts": 40, "q": "Wie alt war Jesus, als er im Tempel bei den Lehrern saß?", "o": ["8 Jahre", "10 Jahre", "12 Jahre", "30 Jahre"], "a": 2, "x": "Mit zwölf Jahren wanderte Jesus zum Pessachfest nach Jerusalem (Lk 2,41–52)."}, {"lvl": 2, "pts": 40, "q": "Wie kam Gottes Geist bei der Taufe auf Jesus herab?", "o": ["wie ein Adler", "wie eine Taube", "wie ein Feuer", "wie ein Stern"], "a": 1, "x": "Der Himmel öffnete sich und Gottes Geist kam wie eine Taube auf Jesus herab."}, {"lvl": 2, "pts": 40, "q": "Was bedeutet das Bitterkraut auf dem Sederteller?", "o": ["das Brot der Eile", "den Lehm für die Ziegel", "Das Leben als Sklaven war bitter.", "das Lamm"], "a": 2, "x": "Das Bitterkraut erinnert daran: Das Leben als Sklaven war bitter."}, {"lvl": 2, "pts": 40, "q": "Womit zeigt man beim Lesen in der Tora-Rolle auf die Buchstaben?", "o": ["mit dem Finger", "mit einem Zeigestab (Jad)", "mit einer Feder", "mit einer Kerze"], "a": 1, "x": "Man berührt die Buchstaben nicht mit dem Finger, sondern benutzt den Jad, einen Zeigestab."}, {"lvl": 2, "pts": 40, "q": "Was heißt „Abba“?", "o": ["Großvater", "lieber Vater", "Lehrer", "König"], "a": 1, "x": "„Abba“ heißt lieber Vater. So nennt Jesus Gott."}]}, {"id": "r3", "name": "Der große Preis", "show": "nach der Quizshow „Der große Preis“", "minutes": 15, "rules": ["Die Teams sind nacheinander dran und wählen ein Feld: Thema und Punkte.", "30 Sekunden beraten, dann antwortet ein Kind für das Team.", "Richtig: Das Team bekommt die Punkte. Falsch: Das nächste Team darf es versuchen.", "Achtung, Risikofeld: Hier gibt es doppelte Punkte!"], "callout": "Welches Feld nehmt ihr?", "categories": [{"name": "Sabbat", "fields": [{"pts": 10, "q": "Was steht auf dem Sabbat-Tisch? Nennt zwei Dinge.", "a": "zwei Kerzen, Challa-Brot, Becher mit Wein oder Traubensaft, weißes Festtischtuch"}, {"pts": 20, "q": "Was bedeuten die Kerzen am Sabbat?", "a": "Licht und Freude: Der Sabbat beginnt."}, {"pts": 30, "q": "Wer soll am Sabbat ruhen?", "a": "Alle – auch Knechte, Mägde und Tiere."}]}, {"name": "Synagoge", "fields": [{"pts": 10, "q": "Wie heißt der Schrank, in dem die Tora-Rollen aufbewahrt werden?", "a": "der Toraschrein"}, {"pts": 20, "q": "Was zeigt das Ewige Licht?", "a": "Es brennt immer – Gott ist immer da."}, {"pts": 30, "risk": true, "q": "Nennt zwei Dinge, die es nur in der Kirche gibt, aber nicht in der Synagoge.", "a": "Taufbecken, Kreuz, Altar"}]}, {"name": "Pessach", "fields": [{"pts": 10, "q": "Wie heißt das Brot ohne Hefe?", "a": "Mazza"}, {"pts": 20, "q": "Warum isst man zu Pessach Brot ohne Hefe?", "a": "Es ist das Brot der Eile – es gab keine Zeit, bis der Teig aufgeht."}, {"pts": 30, "q": "Was bedeutet das Fruchtmus (Charosset) auf dem Sederteller?", "a": "den Lehm, aus dem die Sklaven Ziegel machen mussten"}]}, {"name": "Jesu Leben", "fields": [{"pts": 10, "q": "In welchem Dorf wuchs Jesus auf?", "a": "in Nazaret"}, {"pts": 20, "risk": true, "q": "Was sagt Jesus zu den Pharisäern im Kornfeld?", "a": "„Der Sabbat ist für den Menschen da – nicht der Mensch für den Sabbat.“"}, {"pts": 30, "q": "Was sagt die Stimme aus dem Himmel bei der Taufe?", "a": "„Das ist mein geliebter Sohn, an dem ich Gefallen gefunden habe.“"}]}, {"name": "Gott & Gebet", "fields": [{"pts": 10, "q": "Welches Gebet lehrt Jesus seine Freunde?", "a": "das Vaterunser"}, {"pts": 20, "q": "Ergänzt: „Der HERR ist mein …, nichts wird mir fehlen.“", "a": "Hirt (Ps 23,1)"}, {"pts": 30, "q": "Warum benutzt die Bibel Bilder für Gott?", "a": "Niemand hat Gott je gesehen. Bilder helfen uns, etwas über Gott zu sagen."}]}]}, {"id": "r4", "name": "Das Klassen-Duell", "show": "nach „Familien-Duell“", "minutes": 8, "points": 10, "rules": ["Auf jeder Tafel sind 6 Antworten versteckt.", "Die Teams nennen nacheinander je eine Antwort.", "Steht sie auf der Tafel, wird sie aufgedeckt: 10 Punkte!", "Falsch oder schon genannt: 0 Punkte, das nächste Team ist dran."], "callout": "Die Antwort ist … auf der Tafel?", "boards": [{"q": "Nennt Dinge, die man in einer Synagoge findet.", "a": ["Toraschrein", "Tora-Rolle", "Bima (Lesepult)", "Ewiges Licht", "Menora", "Gebotstafeln"]}, {"q": "Nennt Speisen vom Sederteller.", "a": ["Ei", "Knochen", "Bitterkraut", "Fruchtmus (Charosset)", "Petersilie", "Salatblatt"]}, {"q": "Nennt Bitten aus dem Vaterunser.", "a": ["geheiligt werde dein Name", "Dein Reich komme.", "Dein Wille geschehe …", "Unser tägliches Brot gib uns heute.", "Und vergib uns unsere Schuld …", "Und führe uns nicht in Versuchung …"]}]}, {"id": "r5", "name": "Das Finale: Code knacken", "show": "Finale mit Einsatz", "minutes": 5, "rules": ["Jedes Team setzt vorher 0, 10, 20 oder 30 Punkte – höchstens so viele, wie es hat.", "Dann knacken alle Teams gleichzeitig den Geheimcode. Ihr habt 2 Minuten.", "Richtig: Ihr bekommt euren Einsatz dazu. Falsch: Der Einsatz wird abgezogen."], "stakes": [0, 10, 20, 30], "callout": "Wie viel setzt ihr?", "code": {"msg": "JESUS WAR JUDE", "hint": "Jede Zahl steht für einen Buchstaben: A = 1, B = 2, C = 3 …", "x": "Jesus war Jude: Er betete zu Gott, las die Tora, feierte den Sabbat und die jüdischen Feste."}, "tiebreak": {"q": "Schätzfrage bei Gleichstand: Vor wie vielen Jahren lebte Jesus ungefähr?", "a": "vor etwa 2000 Jahren", "val": 2000}}], "timeline": [["Start & Teams", 3], ["Runde 1: Eins, zwei oder drei", 10], ["Runde 2: Wer wird Bibel-Profi?", 15], ["Runde 3: Der große Preis", 15], ["Runde 4: Das Klassen-Duell", 8], ["Finale: Code knacken", 5], ["Ranking & Siegerehrung", 4]]};

const [R1, R2, R3, R4, R5] = DATA.rounds;

function fresh() {

}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const total = (t) => t.pts.reduce((a, b) => a + b, 0);

// ---------- Ton ----------
let AC = null;
function tone(seq) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d, type]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.85;
    });
  } catch (e) {}
}
const SND = {
  ok: () => tone([[523, .14], [659, .14], [784, .3]]),
  bad: () => tone([[196, .25, "sawtooth"], [147, .4, "sawtooth"]]),
  tick: () => tone([[880, .05, "square"]]),
  reveal: () => tone([[392, .1], [494, .1], [587, .18]]),
  fanfare: () => tone([[523, .18], [523, .1], [523, .1], [659, .3], [523, .18], [659, .18], [784, .6]]),
  drum: () => tone([[110, .08, "square"], [110, .08, "square"], [110, .08, "square"], [110, .08, "square"], [110, .08, "square"], [130, .3, "square"]]),
};

// ---------- Punkte ----------
function award(ti, pts, round) {
  S.teams[ti].pts[round] += pts;
  save(); renderMini(ti);
}

// ---------- Timer ----------
let TM = null;
function timerHTML(sec, id = "tmr") { return `<button class="timer" id="${id}" data-sec="${sec}" title="Timer starten">${ico("watch")}<span>${fmt(sec)}</span></button>`; }
function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function bindTimer(id = "tmr") {
  const el = document.getElementById(id); if (!el) return;
  el.onclick = () => startTimer(el, +el.dataset.sec);
}
function startTimer(el, sec) {
  clearInterval(TM); let left = sec; el.classList.remove("warn");
  const span = el.querySelector("span"); span.textContent = fmt(left);
  TM = setInterval(() => {
    left--; if (!document.body.contains(el)) return clearInterval(TM);
    span.textContent = fmt(Math.max(0, left));
    if (left <= 5 && left > 0) { el.classList.add("warn"); SND.tick(); }
    if (left <= 0) { clearInterval(TM); el.classList.remove("warn"); span.textContent = "Zeit!"; SND.bad(); }
  }, 1000);
}

function badge(i, cls = "tb") { const t = S.teams[i]; return `<span class="${cls}" style="background:${t.color}">${ico(t.icon)}</span>`; }
function turnTeam() {
  if (S.screen === "r2") return S.r2.i % 6;
  if (S.screen === "r3") return S.r3.turn;
  if (S.screen === "r4") return S.r4.turn;
  return -1;
}
function renderMini(bump) {
  const tt = turnTeam();
  $("#mini").innerHTML = S.screen === "home" ? "" : S.teams.map((t, i) =>
    `<span class="t${i === tt ? " turn" : ""}${i === bump ? " bump" : ""}" title="Team ${esc(t.name)}">${badge(i)}${total(t)}</span>`).join("");
  if (bump !== undefined) setTimeout(() => { const e = $("#mini").children[bump]; e && e.classList.remove("bump"); }, 450);
  $("#bSound").textContent = S.sound ? "🔊" : "🔇";
}
const RN = { home: "", intro: "So geht’s", d1: "Runde 1", r1: "Runde 1 · " + R1.name, d2: "Runde 2", r2: "Runde 2 · " + R2.name, d3: "Runde 3",

  const lock = $("#lock"); if (lock) lock.onclick = () => {
    SND.drum(); lock.disabled = true;
    setTimeout(() => { st.rev = true; if (st.sel === q.a) { award(ti, q.pts, 1); SND.ok(); } else SND.bad(); go("r2"); }, 900);
  };
  const j50 = $("#j50"); if (j50) j50.onclick = () => {
    const wrong = [0, 1, 2, 3].filter((k) => k !== q.a); wrong.sort(() => Math.random() - .5);
    st.hidden = wrong.slice(0, 2); if (st.hidden.includes(st.sel)) st.sel = null; S.teams[ti].fifty = false; SND.reveal(); go("r2");
  };
  const jh = $("#jh"); if (jh) jh.onclick = () => {
    S.teams[ti].heft = false; save(); jh.disabled = true;
    $("#tw").innerHTML = timerHTML(30, "th"); startTimer($("#th"), 30);
  };
  document.querySelectorAll("[data-steal]").forEach((b) => b.onclick = () => {
    const i = +b.dataset.steal; st.steal = i; st.stealDone = true; if (i >= 0) { award(i, q.pts / 2, 1); SND.ok(); } go("r2");
  });
  const nx = $("#nx"); if (nx) nx.onclick = () => {
    if (st.i + 1 < 12) { Object.assign(st, { i: st.i + 1, sel: null, rev: false, hidden: [], steal: null, stealDone: false }); go("r2"); }
    else go("score", { after: 2 });
  };
};

// --- Runde 3
function fieldPts(f) { return f.risk ? f.pts * 2 : f.pts; }
V.r3 = () => {
  const st = S.r3;
  if (!st.open) {
    const left = R3.categories.reduce((a, c, ci) => a + c.fields.filter((f, fi) => !st.played[ci + "-" + fi]).length, 0);
    return `<div class="qhead"><div class="turnbox">${badge(st.turn)}<div><h2>Team ${esc(S.teams[st.turn].name)} wählt ein Feld</h2><div class="sub">„${esc(R3.callout)}“ · noch ${left} Felder</div></div></div><span class="spacer"></span>
    <button class="btn alt small" id="skip">Team überspringen</button><button class="btn alt small" id="end">Runde beenden</button></div>
    <div class="board">${R3.categories.map((c) => `<div class="cat">${esc(c.name)}</div>`).join("")}
    ${[0, 1, 2].map((fi) => R3.categories.map((c, ci) => `<button class="field" data-f="${ci}-${fi}" ${st.played[ci + "-" + fi] ? "disabled" : ""}>${c.fields[fi].pts}</button>`).join("")).join("")}</div>`;
  }
  const [ci, fi] = st.open, c = R3.categories[ci], f = c.fields[fi], t = S.teams[st.turn];
  return `<div class="qhead"><div class="turnbox">${badge(st.turn)}<div><h2>${esc(c.name)} für ${f.pts}</h2><div class="sub">Team ${esc(t.name)} ist dran</div></div></div><span class="spacer"></span>
  ${!st.rev ? `<button class="jbtn" id="jh" ${!t.heft ? "disabled" : ""} title="Heft-Joker">Heft</button>` : ""}<span id="tw">${!st.rev ? timerHTML(30) : ""}</span></div>
  ${f.risk ? `<div class="center" style="margin-bottom:14px"><span class="risk">RISIKOFELD! Doppelte Punkte: ${fieldPts(f)}</span></div>` : ""}
  <div class="qbox">${esc(f.q)}</div>
  ${!st.rev ? `<div class="row c" style="margin-top:24px"><button class="btn" id="rv">Auflösen</button></div>` : `
  <div class="answerbox">${esc(f.a)}</div>
  <div class="whoright"><p>Wer hat richtig geantwortet? (+${fieldPts(f)} Punkte)</p>
  <div class="row"><button class="btn green" data-w="${st.turn}">✓ Team ${esc(t.name)}</button>
  ${S.teams.map((tt, i) => i === st.turn ? "" : `<button class="tchip" style="--c:${tt.color}" data-w="${i}">${badge(i)}${esc(tt.name)}</button>`).join("")}
  <button class="btn alt small" data-w="-1">Niemand</button></div></div>`}`;
};
V.r3.bind = () => {
  const st = S.r3; bindTimer();
  document.querySelectorAll(".field").forEach((b) => b.onclick = () => { st.open = b.dataset.f.split("-").map(Number); st.rev = false; SND.reveal(); go("r3"); });
  const sk = $("#skip"); if (sk) sk.onclick = () => { st.turn = (st.turn + 1) % 6; go("r3"); };
  const en = $("#end"); if (en) en.onclick = () => { if (confirm("Runde 3 beenden?")) go("score", { after: 3 }); };
  const rv = $("#rv"); if (rv) rv.onclick = () => { st.rev = true; clearInterval(TM); SND.reveal(); go("r3"); };
  const jh = $("#jh"); if (jh) jh.onclick = () => { S.teams[st.turn].heft = false; save(); jh.disabled = true; const tw = $("#tw"); tw.innerHTML = timerHTML(30, "th"); startTimer($("#th"), 30); };
  document.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => {
    const w = +b.dataset.w, [ci, fi] = st.open, f = R3.categories[ci].fields[fi];
    if (w >= 0) { award(w, fieldPts(f), 2); SND.ok(); } else SND.bad();
    st.played[ci + "-" + fi] = true; st.open = null; st.rev = false; st.turn = (st.turn + 1) % 6;
    const left = R3.categories.reduce((a, c, cj) => a + c.fields.filter((ff, fj) => !st.played[cj + "-" + fj]).length, 0);
    if (!left) go("score", { after: 3 }); else go("r3");
  });
};

// --- Runde 4
V.r4 = () => {
  const st = S.r4, b = R4.boards[st.b], t = S.teams[st.turn];
  const all = st.open.length === 6;
  return `<div class="qhead"><div class="turnbox">${badge(st.turn)}<div><h2>Tafel ${st.b + 1} von 3</h2><div class="sub">Team ${esc(t.name)} nennt eine Antwort</div></div></div><span class="spacer"></span>${timerHTML(15)}</div>
  <div class="qbox">${esc(b.q)}</div>
  <div class="duel">${b.a.map((a, k) => { const o = st.open.includes(k); const by = st.by[st.b + "-" + k];
    return `<button class="bar${o ? " open" : ""}" data-k="${k}" ${o ? "disabled" : ""}><span class="num">${k + 1}</span><span class="txt">${o ? esc(a) : "? ? ?"}${o && by !== undefined && by >= 0 ? `<br><span class="by">gefunden von Team ${esc(S.teams[by].name)}</span>` : ""}</span><span class="pts">10</span></button>`; }).join("")}</div>

V.r4.bind = () => {

    const k = +b.dataset.k; st.open.push(k); st.by[st.b + "-" + k] = st.turn; award(st.turn, R4.points, 3); SND.ok();

// --- Finale

V.r5c.bind = () => {

  document.querySelectorAll("[data-r]").forEach((b) => b.onclick = () => { st.res[+b.dataset.i] = b.dataset.r === "1"; go("r5c"); });

    S.teams.forEach((t, i) => award(i, (st.res[i] ? 1 : -1) * (st.stakes[i] || 0), 4)); st.applied = true; SND.ok(); go("r5c");

// --- Schätzfrage
function ranking() {
  return S.teams.map((t, i) => ({ i, p: total(t), tie: t.tie || 0 })).sort((a, b) => b.p - a.p || b.tie - a.tie || a.i - b.i);
}
function hasTie() { const r = ranking(); for (let k = 0; k < Math.min(3, r.length - 1); k++) if (r[k].p === r[k + 1].p && r[k].tie === r[k + 1].tie) return true; return false; }
V.tie = () => {
  const st = S.r5;
  return `<div class="qhead"><h2>Bei Gleichstand: die Schätzfrage</h2></div>
  <div class="qbox">${esc(R5.tiebreak.q.replace("Schätzfrage bei Gleichstand: ", ""))}</div>
  <div class="stakes" style="margin-top:20px">${S.teams.map((t, i) => `<div class="stk">${badge(i)}<span class="nm">${esc(t.name)}</span><span class="sc">${total(t)} Punkte</span>
  <input type="number" data-i="${i}" value="${st.tie[i] ?? ""}" placeholder="Schätzung" style="width:160px;font:700 20px Inter;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--navy);color:#fff"></div>`).join("")}</div>
  ${st.tieRev ? `<div class="answerbox">${esc(R5.tiebreak.a)}</div>` : ""}
  <div class="row" style="margin-top:20px"><span class="spacer"></span>${st.tieRev ? `<button class="btn" id="fin">Zum Ranking ▶</button>` : `<button class="btn" id="rv">Auflösen</button>`}</div>`;
};
V.tie.bind = () => {
  const st = S.r5;
  document.querySelectorAll(".stk input").forEach((inp) => inp.oninput = () => { st.tie[+inp.dataset.i] = inp.value; save(); });
  const rv = $("#rv"); if (rv) rv.onclick = () => {
    S.teams.forEach((t, i) => { const v = parseFloat(st.tie[i]); t.tie = isNaN(v) ? -1e9 : -Math.abs(v - R5.tiebreak.val); });
    st.tieRev = true; SND.reveal(); go("tie");
  };
  const fn = $("#fin"); if (fn) fn.onclick = () => go("rank", { rank: { shown: 0 } });
};

// --- Punktestand
V.score = () => {
  const r = ranking(), max = Math.max(10, ...r.map((x) => x.p)), a = S.after;
  const title = a === 5 ? "Der Endstand" : a ? "Zwischenstand nach Runde " + a : "Punktestand";
  const next = { 1: "d2", 2: "d3", 3: "d4", 4: "d5" }[a];
  let place = 0, prev = null;
  return `<div class="qhead"><h2>${title}</h2><span class="spacer"></span><span class="sub">Korrektur mit + und −</span></div>
  <div class="score">${r.map((x, k) => { if (x.p !== prev) place = k + 1; prev = x.p; const t = S.teams[x.i];
    return `<div class="srow" style="--c:${t.color}"><span class="pl">${place}.</span>${badge(x.i)}<span class="nm">${esc(t.name)}</span><span class="track"><i style="width:${Math.max(2, x.p / max * 100)}%"></i></span><span class="pts">${x.p}</span>
    <span class="adj"><button data-i="${x.i}" data-d="-5" title="5 Punkte abziehen">−</button> <button data-i="${x.i}" data-d="5" title="5 Punkte dazu">+</button></span></div>`; }).join("")}</div>
  <div class="row" style="margin-top:24px"><span class="spacer"></span>
  ${a === 5 ? `${hasTie() ? `<button class="btn alt" onclick="go('tie')">Schätzfrage (Gleichstand)</button>` : ""}<button class="btn" onclick="go('rank',{rank:{shown:0}})">Zum Ranking ▶</button>`
    : next ? `<button class="btn" onclick="go('${next}')">Weiter zu ${next === "d5" ? "dem Finale" : "Runde " + (a + 1)} ▶</button>` : `<button class="btn" onclick="go(S.lastScreen||'intro')">Zurück zum Spiel</button>`}</div>`;
};
V.score.bind = () => {
  document.querySelectorAll(".adj button").forEach((b) => b.onclick = () => {
    const i = +b.dataset.i, d = +b.dataset.d, rIdx = Math.max(0, Math.min(4, (S.after || 1) - 1));

};

// --- Ranking (von hinten nach vorne)
V.rank = () => {

  ${shown < rest.length ? `<div class="row c" style="margin-top:24px"><button class="btn" id="nx">Platz ${n - shown} verkünden</button></div>`

// ---------- Konfetti ----------
function confetti() {
  const cv = $("#confetti"), cx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ffb400", "#e74c3c", "#2e86de", "#27ae60", "#8e44ad", "#ffffff", "#16a085"];
  const P = Array.from({ length: 220 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6, w: 6 + Math.random() * 8, h: 10 + Math.random() * 10,
    vx: -2 + Math.random() * 4, vy: 2 + Math.random() * 4, r: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0;
  (function loop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    P.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if (++f < 300) requestAnimationFrame(loop); else cx.clearRect(0, 0, cv.width, cv.height);
  })();
}

// ---------- Menü ----------
function openMenu() {
  const items = [["intro", "So geht’s & Joker"], ["d1", "Runde 1: " + R1.name], ["d2", "Runde 2: " + R2.name], ["d3", "Runde 3: " + R3.name],
    ["d4", "Runde 4: " + R4.name], ["d5", "Finale: " + R5.name], ["score", "Punktestand / Korrektur"], ["rank", "Ranking"], ["win", "Siegerehrung"]];
  $("#ovc").innerHTML = `<div class="row"><h2>Menü</h2><span class="spacer"></span><button class="iconbtn" id="cl">✕</button></div>
  <div class="menu">${items.map(([k, t]) => `<button data-go="${k}">${esc(t)}</button>`).join("")}</div>
  <h3 style="margin-top:18px;color:var(--gold2)">Joker der Teams</h3>
  <div class="menu">${S.teams.map((t, i) => `<div class="row" style="margin:6px 0">${badge(i)}<b style="width:120px">${esc(t.name)}</b>
    <label><input type="checkbox" data-j="fifty" data-i="${i}" ${t.fifty ? "checked" : ""}> 50:50</label>
    <label><input type="checkbox" data-j="heft" data-i="${i}" ${t.heft ? "checked" : ""}> Heft-Joker</label></div>`).join("")}</div>
  <div class="row" style="margin-top:16px"><button class="btn red small" id="reset">Spiel zurücksetzen</button></div>`;
  $("#ov").classList.add("open");
  $("#cl").onclick = closeMenu;
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => { closeMenu(); const k = b.dataset.go;
    if (k === "score") { S.lastScreen = S.screen; go("score", { after: 0 }); } else if (k === "rank") go("rank", { rank: { shown: 0 } }); else if (k === "win") go("win", { win: 0 }); else go(k); });
  document.querySelectorAll("[data-j]").forEach((c) => c.onchange = () => { S.teams[+c.dataset.i][c.dataset.j] = c.checked; save(); render(); });
  $("#reset").onclick = () => { if (confirm("Wirklich alles zurücksetzen? Alle Punkte gehen verloren.")) { S = fresh(); save(); closeMenu(); render(); } };
}
function closeMenu() { $("#ov").classList.remove("open"); }
$("#ov").onclick = (e) => { if (e.target.id === "ov") closeMenu(); };
$("#bMenu").onclick = openMenu;
$("#bScore").onclick = () => { if (S.screen !== "score") { S.lastScreen = S.screen; go("score", { after: 0 }); } };
$("#bSound").onclick = () => { S.sound = !S.sound; save(); renderMini(); };
$("#bFull").onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} };
$("#brand").onclick = () => go("home");

// ---------- Render ----------
function render() {
  if (!V[S.screen]) S.screen = "home";
  if (!["home", "score"].includes(S.screen)) S.lastScreen = S.screen;
  $("#app").innerHTML = V[S.screen]() + `<div class="foot">Lehrer: Thorsten von Plotho-Kettner · Pater-Alois-Grimm-Schule Külsheim · Religion Klasse 4a/b</div>`;
  $("#rname").textContent = RN[S.screen] || "";
  renderMini();
  V[S.screen].bind && V[S.screen].bind();
  save();
}
render();
</script>
</body>
</html>
